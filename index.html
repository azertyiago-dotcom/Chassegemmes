<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Gemmes Pro - Prospection Mobile</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e2e2;
            overflow: hidden;
        }
        #main-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        /* Zone d'attente locale sans crash */
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
            background-color: #111b30;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #84a9ac;
        }
        .panel-inférieur {
            background-color: #162447;
            border-top: 3px solid #4facfe;
            padding: 12px 20px;
            z-index: 10;
        }
        h1 {
            color: #00f2fe;
            margin: 0 0 4px 0;
            text-transform: uppercase;
            font-size: 18px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .searching { background-color: #b83b5e; color: #fff; }
        .active { background-color: #00b16a; color: #fff; }
        .geo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
            background: #1f4068;
            padding: 8px;
            border-radius: 6px;
        }
        .geo-item { font-family: monospace; color: #00f2fe; }
        .geo-item span { color: #84a9ac; font-family: sans-serif; }
    </style>
</head>
<body>

    <div id="main-container">
        <!-- Message initial écrit en brut pour vérifier que l'écran ne gèle pas -->
        <div id="map">Chargement des modules cartographiques...</div>

        <div class="panel-inférieur">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>Gemmes Pro Maps</h1>
                <div id="status" class="status-badge searching">Vérification Permissions...</div>
            </div>
            <div class="geo-grid">
                <div class="geo-item"><span>GPS:</span><span id="coordsAffichage">Recherche...</span></div>
                <div class="geo-item" style="text-align: right;"><span>Précision:</span><span id="acc">--</span></div>
            </div>
        </div>
    </div>

    <!-- Chargement impératif de la base locale en premier -->
    <script src="gisements.js"></script>
    <script src="cordova.js"></script>
    
    <script>
        let map = null;
        let userMarker = null;
        let isMapLoaded = false;

        function updateStatus(text, statusClass) {
            document.getElementById('status').textContent = text;
            document.getElementById('status').className = 'status-badge ' + statusClass;
        }

        // On écoute le signal natif Cordova pour démarrer les capteurs
        document.addEventListener('deviceready', () => {
            updateStatus('Capteurs OK - Fix GPS...', 'searching');
            
            // Lancement immédiat du capteur avec tolérance maximale pour déclencher la pop-up de droits Android
            navigator.geolocation.getCurrentPosition(onFirstFixSuccess, onFirstFixError, {
                enableHighAccuracy: false, // Évite le gel satellite intérieur au premier démarrage
                timeout: 8000,
                maximumAge: 60000 // Accepte une position en cache si existante
            });
        }, false);

        function onFirstFixSuccess(position) {
            updateStatus('Signal validé', 'active');
            injecterLibrairieCartographique(position);
        }

        function onFirstFixError(error) {
            console.log("Erreur de premier fix, forçage des cartes quand même.");
            // Secours : si le GPS stagne (ex: en intérieur), on simule une position sur Bordeaux pour forcer l'affichage
            const simulationAquitaine = {
                coords: { latitude: 44.8377, longitude: -0.5791, accuracy: 999 }
            };
            injecterLibrairieCartographique(simulationAquitaine);
        }

        // INJECTION DYNAMIQUE APRÈS RÉSOLUTION DU GPS POUR ÉVITER LE CRASH WEBVIEW
        function injecterLibrairieCartographique(initialPosition) {
            if (isMapLoaded) return;
            isMapLoaded = true;

            document.getElementById('map').innerHTML = ""; // Vide le texte de chargement

            // Chargement CSS Leaflet
            let leafletCss = document.createElement('link');
            leafletCss.rel = 'stylesheet';
            leafletCss.href = 'https://cloudflare.com';
            document.head.appendChild(leafletCss);

            // Chargement JS Leaflet
            let leafletJs = document.createElement('script');
            leafletJs.src = 'https://cloudflare.com';
            leafletJs.onload = function() {
                // Initialisation de la carte une fois le fichier JS téléchargé en mémoire
                map = L.map('map', { zoomControl: true }).setView([initialPosition.coords.latitude, initialPosition.coords.longitude], 12);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

                // Traitement de la position
                rafraichirPositionEcran(initialPosition);
                chargerMarqueursGisements();

                // Lancement de l'écoute continue sur le terrain
                navigator.geolocation.watchPosition(rafraichirPositionEcran, () => {}, {
                    enableHighAccuracy: true,
                    maximumAge: 0
                });
            };
            document.head.appendChild(leafletJs);
        }

        function rafraichirPositionEcran(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            document.getElementById('coordsAffichage').textContent = lat.toFixed(4) + " , " + lng.toFixed(4);
            document.getElementById('acc').textContent = position.coords.accuracy.toFixed(0) + ' m';

            if (map) {
                if (!userMarker) {
                    userMarker = L.marker([lat, lng]).addTo(map).bindPopup("Vous êtes ici").openPopup();
                } else {
                    userMarker.setLatLng([lat, lng]);
                }
            }
        }

        function chargerMarqueursGisements() {
            if (typeof REPERTOIRE_GISEMENTS !== 'undefined' && map) {
                REPERTOIRE_GISEMENTS.forEach(g => {
                    L.marker([g.lat, g.lng]).addTo(map)
                        .bindPopup(`<b>${g.nom}</b><br><span style="font-size:11px;color:#666;">${g.details}</span>`);
                });
            }
        }
    </script>
</body>
</html>
