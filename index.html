<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    
    <!-- Sécurité Android : Autorise le script local et l'affichage des tuiles OpenStreetMap -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: https://*.tile.openstreetmap.org;">

    <title>Gemmes Pro - Cartographie Locale</title>
    
    <!-- Chargement immédiat des fichiers locaux intégrés dans l'APK -->
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e2e2;
            overflow: hidden;
        }
        #main-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
            background-color: #111b30;
        }
        .panel-inférieur {
            background-color: #162447;
            border-top: 3px solid #4facfe;
            padding: 12px 20px;
            z-index: 10;
        }
        h1 {
            color: #00f2fe;
            margin: 0 0 4px 0;
            text-transform: uppercase;
            font-size: 18px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .searching { background-color: #b83b5e; color: #fff; }
        .active { background-color: #00b16a; color: #fff; }
        .geo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
            background: #1f4068;
            padding: 8px;
            border-radius: 6px;
        }
        .geo-item { font-family: monospace; color: #00f2fe; }
        .geo-item span { color: #84a9ac; font-family: sans-serif; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="map"></div>

        <div class="panel-inférieur">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>Gemmes Pro Maps</h1>
                <div id="status" class="status-badge searching">Initialisation...</div>
            </div>
            <div class="geo-grid">
                <div class="geo-item"><span>GPS:</span><span id="coordsAffichage">Recherche...</span></div>
                <div class="geo-item" style="text-align: right;"><span>Précision:</span><span id="acc">--</span></div>
            </div>
        </div>
    </div>

    <script src="gisements.js"></script>
    <script src="cordova.js"></script>
    
    <script>
        let map = null;
        let userMarker = null;

        function updateStatus(text, statusClass) {
            document.getElementById('status').textContent = text;
            document.getElementById('status').className = 'status-badge ' + statusClass;
        }

        document.addEventListener('deviceready', () => {
            updateStatus('Recherche satellites...', 'searching');
            
            // Démarrage direct du suivi GPS
            navigator.geolocation.watchPosition(onLocationSuccess, onLocationError, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000
            });
        }, false);

        function onLocationSuccess(position) {
            updateStatus('GPS Actif', 'active');
            
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            
            document.getElementById('coordsAffichage').textContent = lat.toFixed(4) + " , " + lng.toFixed(4);
            document.getElementById('acc').textContent = accuracy.toFixed(0) + ' m';

            // Initialisation de la carte si elle n'existe pas encore
            if (!map) {
                map = L.map('map', { zoomControl: true }).setView([lat, lng], 13);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
                    maxZoom: 19 
                }).addTo(map);

                chargerMarqueursGisements();
            }

            // Mise à jour du marqueur de l'utilisateur
            if (!userMarker) {
                userMarker = L.marker([lat, lng]).addTo(map).bindPopup("Vous êtes ici").openPopup();
            } else {
                userMarker.setLatLng([lat, lng]);
            }
        }

        function chargerMarqueursGisements() {
            if (typeof REPERTOIRE_GISEMENTS !== 'undefined' && map) {
                REPERTOIRE_GISEMENTS.forEach(g => {
                    L.marker([g.lat, g.lng]).addTo(map)
                        .bindPopup(`<b>${g.nom}</b><br><span style="font-size:11px;color:#666;">${g.details}</span>`);
                });
            }
        }

        function onLocationError(error) {
            updateStatus('Signal faible...', 'searching');
        }
    </script>
</body>
</html>
