<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Gemmes Pro - Cartographie</title>
    
    <!-- Inclusion des feuilles de style et scripts de la carte Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e2e2;
            overflow: hidden;
        }

        /* Interface globale scindée en deux : Carte en haut, données en bas */
        #main-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }

        .panel-inférieur {
            background-color: #162447;
            border-top: 3px solid #4facfe;
            padding: 12px 20px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.4);
            z-index: 10;
        }

        h1 {
            color: #00f2fe;
            margin: 0 0 4px 0;
            text-transform: uppercase;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .searching { background-color: #b83b5e; color: #fff; }
        .active { background-color: #00b16a; color: #fff; }

        .geo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
            background: #1f4068;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(79, 172, 254, 0.3);
        }
        .geo-item {
            font-family: monospace;
            color: #00f2fe;
        }
        .geo-item span {
            color: #84a9ac;
            font-family: sans-serif;
            margin-right: 4px;
        }
    </style>
</head>
<body>

    <div id="main-container">
        <!-- Zone d'affichage de la carte interactive -->
        <div id="map"></div>

        <!-- Tableau de bord inférieur -->
        <div class="panel-inférieur">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>Gemmes Pro Maps</h1>
                <div id="status" class="status-badge searching">Fix Satellites...</div>
            </div>
            
            <div class="geo-grid">
                <div class="geo-item"><span>GPS:</span><span id="coordsAffichage">En attente...</span></div>
                <div class="geo-item" style="text-align: right;"><span>Précision:</span><span id="acc">--</span></div>
            </div>
        </div>
    </div>

    <!-- Chargement des scripts de votre architecture mobile -->
    <script src="gisements.js"></script>
    <script src="cordova.js"></script>
    <script>
        let watchId = null;
        let map = null;
        let userMarker = null;
        let userCircle = null;
        let gisementsMarqueurs = [];

        function updateStatus(text, statusClass) {
            const statusEl = document.getElementById('status');
            if (statusEl) {
                statusEl.textContent = text;
                statusEl.className = 'status-badge ' + statusClass;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            // 1. Initialisation par défaut de la carte centrée sur la France
            map = L.map('map', {
                zoomControl: false // Désactivé pour épurer l'interface mobile
            }).setView([46.6033, 1.8883], 6);

            // Ajout des boutons de zoom en bas à droite pour une meilleure ergonomie tactile
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Chargement des tuiles OpenStreetMap cartographiques gratuites
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // 2. Lancement des capteurs Cordova natifs
            document.addEventListener('deviceready', () => {
                updateStatus('Radar Synchro', 'searching');
                startGeolocation();
            }, false);
        });

        function startGeolocation() {
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            watchId = navigator.geolocation.watchPosition(onSuccess, handleGeoError, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000
            });
        }

        function onSuccess(position) {
            updateStatus('Carte Active', 'active');
            const myLat = position.coords.latitude;
            const myLng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            document.getElementById('coordsAffichage').textContent = myLat.toFixed(4) + " , " + myLng.toFixed(4);
            document.getElementById('acc').textContent = accuracy.toFixed(0) + ' m';

            // 3. Gestion de la position utilisateur sur la carte
            if (!userMarker) {
                // Premier point trouvé : on crée le marqueur bleu et on centre la carte
                userMarker = L.marker([myLat, myLng]).addTo(map)
                    .bindPopup("<b>Votre position de prospection</b>").openPopup();
                
                userCircle = L.circle([myLat, myLng], {
                    radius: accuracy,
                    color: '#00f2fe',
                    fillColor: '#4facfe',
                    fillOpacity: 0.15
                }).addTo(map);

                // Zoom automatique serré autour de votre position réelle
                map.setView([myLat, myLng], 13);
                
                // Dessiner le catalogue des gisements du fichier gisements.js
                chargerMarqueursGisements();
            } else {
                // Mises à jour en direct pendant que vous marchez sur le terrain
                userMarker.setLatLng([myLat, myLng]);
                userCircle.setLatLng([myLat, myLng]);
                userCircle.setRadius(accuracy);
            }
        }

        function chargerMarqueursGisements() {
            // Nettoyage préventif
            gisementsMarqueurs.forEach(m => map.removeLayer(m));
            gisementsMarqueurs = [];

            // Icône personnalisée rouge pour distinguer les gisements
            const gemIcon = L.icon({
                iconUrl: 'https://githubusercontent.com',
                shadowUrl: 'https://cloudflare.com',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            });

            // Boucle de lecture de la base réseau embarquée
            REPERTOIRE_GISEMENTS.forEach(g => {
                const marker = L.marker([g.lat, g.lng], { icon: gemIcon }).addTo(map)
                    .bindPopup(`<b>${g.nom}</b><br><span style="font-size:12px;color:#555;">${g.details}</span>`);
                gisementsMarqueurs.push(marker);
            });
        }

        function handleGeoError(error) {
            updateStatus('Recherche satellites...', 'searching');
        }
    </script>
</body>
</html>
