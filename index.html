<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    
    <!-- Sécurité Android : Autorise le fonctionnement en circuit fermé local complet -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: gap:">

    <title>Gemmes Pro - Radar Infaillible</title>
    
    <!-- Fichiers cartographiques locaux (gérés par le workflow) -->
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e2e2;
            overflow: hidden;
        }

        #main-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Hauteur fixe absolue pour le Radar */
        #map {
            height: 55vh;
            width: 100%;
            background-color: #0f172a;
            position: relative;
        }

        /* Hauteur fixe pour le panneau des données et de la liste */
        .panel-inférieur {
            height: 45vh;
            background-color: #162447;
            border-top: 3px solid #4facfe;
            box-sizing: border-box;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        h1 {
            color: #00f2fe;
            margin: 0;
            text-transform: uppercase;
            font-size: 16px;
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .searching { background-color: #b83b5e; color: #fff; }
        .active { background-color: #00b16a; color: #fff; }
        
        .geo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 12px;
            background: #1f4068;
            padding: 6px;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .geo-item { font-family: monospace; color: #00f2fe; }
        .geo-item span { color: #84a9ac; font-family: sans-serif; }

        .gisement-title {
            color: #4facfe;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-align: left;
        }

        .gisements-list {
            flex: 1;
            margin: 0;
            padding: 0;
            list-style: none;
            overflow-y: auto;
        }

        .gisement-item {
            background: #111b30;
            border-left: 4px solid #b83b5e;
            margin-bottom: 5px;
            padding: 8px 10px;
            border-radius: 0 4px 4px 0;
            text-align: left;
            font-size: 13px;
        }
        .gisement-name { font-weight: bold; color: #fff; }
        .gisement-dist { float: right; color: #00f2fe; font-weight: bold; font-family: monospace; }
        .gisement-desc { font-size: 11px; color: #84a9ac; margin-top: 2px; }
    </style>
</head>
<body>

    <div id="main-container">
        <!-- Partie Haute : Le Radar graphique -->
        <div id="map"></div>

        <!-- Partie Basse : Le Tableau de bord & La Liste de Proximité -->
        <div class="panel-inférieur">
            <div class="header-panel">
                <h1>Gemmes Pro Radar</h1>
                <div id="status" class="status-badge searching">Initialisation...</div>
            </div>
            
            <div class="geo-grid">
                <div class="geo-item"><span>GPS:</span><span id="coordsAffichage">Recherche...</span></div>
                <div class="geo-item" style="text-align: right;"><span>Précision:</span><span id="acc">--</span></div>
            </div>

            <div class="gisement-title">📌 Gisements à proximité :</div>
            
            <ul id="listeGisements" class="gisements-list">
                <li style="text-align: center; color: #84a9ac; padding-top: 10px; font-size: 12px;">En attente de coordonnées satellites...</li>
            </ul>
        </div>
    </div>

    <script src="gisements.js"></script>
    <script src="cordova.js"></script>
    
    <script>
        let map = null;
        let userMarker = null;
        let systemeDemarre = false;
        let useHighAccuracy = true; 
        let watchdogTimer = null;
        let positionRecueUneFois = false;

        function updateStatus(text, statusClass) {
            const el = document.getElementById('status');
            if (el) {
                el.textContent = text;
                el.className = 'status-badge ' + statusClass;
            }
        }

        function demarrerApplication() {
            if (systemeDemarre) return;
            systemeDemarre = true;
            lancerSuiviGPS();
        }

        function lancerSuiviGPS() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }

            updateStatus(useHighAccuracy ? 'Recherche Satellites...' : 'Secours Réseau...', 'searching');
            
            // --- CORRECTION DU BLOCAGE FICTIONNEL : LE CHIEN DE GARDE ---
            if (watchdogTimer !== null) clearTimeout(watchdogTimer);
            
            // Si après 7 secondes le téléphone n'a rien renvoyé du tout, on force la WebView à changer de mode
            watchdogTimer = setTimeout(() => {
                if (!positionRecueUneFois && useHighAccuracy) {
                    console.log("Watchdog : Satellites bloqués. Bascule forcée sur le réseau mobile/Wi-Fi.");
                    useHighAccuracy = false;
                    lancerSuiviGPS(); // Relance immédiate avec le mode réseau permissif
                }
            }, 7000);

            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(onLocationSuccess, onLocationError, {
                    enableHighAccuracy: useHighAccuracy,
                    maximumAge: 0,
                    timeout: 9000
                });
            } else {
                updateStatus('Erreur GPS', 'searching');
            }
        }

        document.addEventListener('deviceready', demarrerApplication, false);
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { if (!systemeDemarre) demarrerApplication(); }, 1500);
        });

        function calculerDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function onLocationSuccess(position) {
            positionRecueUneFois = true;
            if (watchdogTimer !== null) clearTimeout(watchdogTimer);
            
            updateStatus(useHighAccuracy ? 'GPS Haute Précision' : 'Position Réseau (OK)', 'active');
            
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            
            document.getElementById('coordsAffichage').textContent = lat.toFixed(4) + " , " + lng.toFixed(4);
            document.getElementById('acc').textContent = accuracy.toFixed(0) + ' m';

            // Initialisation et rendu de l'affichage cartographique asynchrone
            if (!map && typeof L !== 'undefined') {
                try {
                    setTimeout(() => {
                        if (map) return;
                        
                        map = L.map('map', { 
                            zoomControl: true,
                            attributionControl: false 
                        }).setView([lat, lng], 11);

                        // Cercles concentriques de distance
                        L.circle([lat, lng], { radius: 2000, color: '#4facfe', weight: 1, fill: false, dashArray: '5, 5' }).addTo(map);
                        L.circle([lat, lng], { radius: 5000, color: '#4facfe', weight: 1, fill: false, dashArray: '5, 5' }).addTo(map);
                        L.circle([lat, lng], { radius: 10000, color: '#4facfe', weight: 1, fill: false, dashArray: '5, 5' }).addTo(map);

                        actualiserMarqueursRadar(lat, lng);
                    }, 50);
                } catch (e) {
                    console.log("Erreur d'initialisation de la carte : " + e.message);
                }
            } else if (map) {
                if (userMarker) userMarker.setLatLng([lat, lng]);
            }

            genererAffichageGisements(lat, lng);
        }

        function actualiserMarqueursRadar(myLat, myLng) {
            if (typeof REPERTOIRE_GISEMENTS === 'undefined' || !map) return;

            if (!userMarker) {
                userMarker = L.circleMarker([myLat, myLng], {
                    radius: 9,
                    color: '#ffffff',
                    weight: 2,
                    fillColor: '#00f2fe',
                    fillOpacity: 1
                }).addTo(map).bindPopup("Vous êtes ici");
            }

            REPERTOIRE_GISEMENTS.forEach(g => {
                const distanceGis = calculerDistance(myLat, myLng, g.lat, g.lng);
