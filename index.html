<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chasseur de Gemmes Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #1a1a2e;
            color: #e2e2e2;
        }
        h1 {
            color: #00f2fe;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 24px;
        }
        .subtitle {
            color: #4facfe;
            margin-top: 0;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .radar-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 25px auto;
            border: 4px solid #4facfe;
            border-radius: 50%;
            background: radial-gradient(circle, #162447 20%, #1a1a2e 80%);
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            overflow: hidden;
        }
        .radar-sweep {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(0,242,254,0.4) 0%, rgba(0,0,0,0) 50%);
            transform-origin: center;
            border-radius: 50%;
            animation: radar-beam 3s linear infinite;
        }
        @keyframes radar-beam {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .geo-box {
            background-color: #162447;
            border: 1px solid #4facfe;
            border-radius: 10px;
            padding: 15px;
            margin: 15px auto;
            max-width: 320px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .geo-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 1px solid rgba(79, 172, 254, 0.2);
            padding-bottom: 5px;
        }
        .geo-line:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .label { color: #84a9ac; font-weight: bold; }
        .value { color: #00f2fe; font-family: monospace; font-size: 17px; }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .searching { background-color: #b83b5e; color: #fff; }
        .active { background-color: #00b16a; color: #fff; }

        .mode-container {
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .btn-mode {
            background-color: #1f4068;
            color: white;
            border: 2px solid #4facfe;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-mode.gps-active {
            background-color: #00f2fe;
            color: #1a1a2e;
            border-color: #fff;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }
    </style>
</head>
<body>

    <h1>Gemmes Pro</h1>
    <p class="subtitle">Détection Géologique &amp; Hors-Ligne</p>

    <div class="radar-container">
        <div class="radar-sweep"></div>
    </div>

    <div id="status" class="status-badge searching">Initialisation...</div>

    <div class="mode-container">
        <button id="modeBtn" class="btn-mode" onclick="toggleMode()">Mode : Wi-Fi / Réseau</button>
    </div>

    <div class="geo-box">
        <div class="geo-line">
            <span class="label">Source du signal :</span>
            <span id="signalSource" class="value" style="color: #4facfe;">Wi-Fi / Cellulaire</span>
        </div>
        <div class="geo-line">
            <span class="label">Latitude :</span>
            <span id="lat" class="value">--</span>
        </div>
        <div class="geo-line">
            <span class="label">Longitude :</span>
            <span id="lng" class="value">--</span>
        </div>
        <div class="geo-line">
            <span class="label">Altitude :</span>
            <span id="alt" class="value">--</span>
        </div>
        <div class="geo-line">
            <span class="label">Précision :</span>
            <span id="acc" class="value">--</span>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script>
        let watchId = null;
        let useHighAccuracy = false;

        document.addEventListener('deviceready', () => {
            // Étape obligatoire : On effectue une première requête rapide pour forcer Android à afficher la popup de demande d'autorisation
            updateStatus('Vérification des accès...', 'searching');
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    // Si l'utilisateur accepte, on lance le suivi en temps réel (watchPosition)
                    startGeolocation();
                },
                (error) => {
                    handleGeoError(error);
                },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        });

        function startGeolocation() {
            updateStatus('Recherche du signal...', 'searching');
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }
            
            // Lancement du tracker
            watchId = navigator.geolocation.watchPosition(onSuccess, handleGeoError, {
                enableHighAccuracy: useHighAccuracy,
                maximumAge: 3000,
                timeout: 25000 // Augmentation du timeout pour laisser le temps aux puces GPS froides de s'activer
            });
        }

        function onSuccess(position) {
            updateStatus('Signal Actif', 'active');
            document.getElementById('lat').textContent = position.coords.latitude.toFixed(6);
            document.getElementById('lng').textContent = position.coords.longitude.toFixed(6);
            document.getElementById('alt').textContent = position.coords.altitude !== null ? position.coords.altitude.toFixed(2) + ' m' : '--';
            document.getElementById('acc').textContent = position.coords.accuracy.toFixed(2) + ' m';
            document.getElementById('signalSource').textContent = useHighAccuracy ? 'GPS' : 'Wi-Fi / Cellulaire';
        }

        function handleGeoError(error) {
            let msg = 'Erreur inconnue';
            if (error.code === 1) {
                msg = 'Accès Localisation Refusé';
            } else if (error.code === 2) {
                msg = 'Position indisponible (Activez le GPS)';
            } else if (error.code === 3) {
                msg = 'Recherche du signal trop longue...';
            }
            updateStatus(msg, 'searching');
        }

        function toggleMode() {
            useHighAccuracy = !useHighAccuracy;
            const btn = document.getElementById('modeBtn');
            btn.classList.toggle('gps-active', useHighAccuracy);
            btn.textContent = 'Mode : ' + (useHighAccuracy ? 'GPS' : 'Wi-Fi / Réseau');
            startGeolocation();
        }
    </script>
</body>
</html>
