<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    
    <!-- Sécurité permissive pour s'assurer que rien ne bloque l'affichage local -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: gap:">

    <title>Gemmes Pro - Radar &amp; Liste</title>
    
    <!-- Fichiers cartographiques locaux (injectés par votre workflow) -->
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e2e2;
            overflow: hidden;
        }

        #main-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* CORRECTION : Hauteur fixe absolue de 55% de l'écran pour le Radar */
        #map {
            height: 55vh;
            width: 100%;
            background-color: #0f172a;
        }

        /* CORRECTION : Hauteur fixe de 45% pour le panneau des données et de la liste */
        .panel-inférieur {
            height: 45vh;
            background-color: #162447;
            border-top: 3px solid #4facfe;
            box-sizing: border-box;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        h1 {
            color: #00f2fe;
            margin: 0;
            text-transform: uppercase;
            font-size: 16px;
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .searching { background-color: #b83b5e; color: #fff; }
        .active { background-color: #00b16a; color: #fff; }
        
        .geo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 12px;
            background: #1f4068;
            padding: 6px;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .geo-item { font-family: monospace; color: #00f2fe; }
        .geo-item span { color: #84a9ac; font-family: sans-serif; }

        /* Style de la liste défilante des gisements */
        .gisement-title {
            color: #4facfe;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-align: left;
        }

        .gisements-list {
            flex: 1;
            margin: 0;
            padding: 0;
            list-style: none;
            overflow-y: auto; /* Permet de faire défiler les gisements s'il y en a beaucoup */
        }

        .gisement-item {
            background: #111b30;
            border-left: 4px solid #b83b5e;
            margin-bottom: 5px;
            padding: 8px 10px;
            border-radius: 0 4px 4px 0;
            text-align: left;
            font-size: 13px;
        }
        .gisement-name { font-weight: bold; color: #fff; }
        .gisement-dist { float: right; color: #00f2fe; font-weight: bold; font-family: monospace; }
        .gisement-desc { font-size: 11px; color: #84a9ac; margin-top: 2px; }
    </style>
</head>
<body>

    <div id="main-container">
        <!-- Partie Haute : Le Radar graphique -->
        <div id="map"></div>

        <!-- Partie Basse : Le Tableau de bord & La Liste de Proximité -->
        <div class="panel-inférieur">
            <div class="header-panel">
                <h1>Gemmes Pro Radar</h1>
                <div id="status" class="status-badge searching">Initialisation...</div>
            </div>
            
            <div class="geo-grid">
                <div class="geo-item"><span>GPS:</span><span id="coordsAffichage">Recherche...</span></div>
                <div class="geo-item" style="text-align: right;"><span>Précision:</span><span id="acc">--</span></div>
            </div>

            <div class="gisement-title">📌 Gisements à proximité :</div>
            
            <!-- Liste dynamique contenant les gisements réels -->
            <ul id="listeGisements" class="gisements-list">
                <li style="text-align: center; color: #84a9ac; padding-top: 10px; font-size: 12px;">En attente de coordonnées satellites...</li>
            </ul>
        </div>
    </div>

    <!-- Chargement ordonné des fichiers -->
    <script src="gisements.js"></script>
    <script src="cordova.js"></script>
    
    <script>
        let map = null;
        let userMarker = null;
        let systemeDemarre = false;

        function updateStatus(text, statusClass) {
            const el = document.getElementById('status');
            if (el) {
                el.textContent = text;
                el.className = 'status-badge ' + statusClass;
            }
        }

        function demarrerApplication() {
            if (systemeDemarre) return;
            systemeDemarre = true;

            updateStatus('Recherche satellites...', 'searching');
            
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(onLocationSuccess, onLocationError, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                });
            } else {
                updateStatus('Erreur GPS', 'searching');
            }
        }

        // Écouteurs de démarrage mobiles
        document.addEventListener('deviceready', demarrerApplication, false);
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { if (!systemeDemarre) demarrerApplication(); }, 1500);
        });

        // Formule mathématique globale de distance
        function calculerDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function onLocationSuccess(position) {
            updateStatus('Radar Actif', 'active');
            
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            
            document.getElementById('coordsAffichage').textContent = lat.toFixed(4) + " , " + lng.toFixed(4);
            document.getElementById('acc').textContent = accuracy.toFixed(0) + ' m';

            // 1. Gestion de la zone Radar graphique (Leaflet)
            if (!map) {
                map = L.map('map', { 
                    zoomControl: true,
                    attributionControl: false 
                }).setView([lat, lng], 11);

                // Cercles concentriques de distance
                L.circle([lat, lng], { radius: 2000, color: '#4facfe', weight: 1, fill: false, dashArray: '5, 5' }).addTo(map);
                L.circle([lat, lng], { radius: 5000, color: '#4facfe', weight: 1, fill: false, dashArray: '5, 5' }).addTo(map);
                L.circle([lat, lng], { radius: 10000, color: '#4facfe', weight: 1, fill: false, dashArray: '5, 5' }).addTo(map);
            }

            if (!userMarker) {
                userMarker = L.circleMarker([lat, lng], {
                    radius: 9,
                    color: '#ffffff',
                    weight: 2,
                    fillColor: '#00f2fe',
                    fillOpacity: 1
                }).addTo(map).bindPopup("Vous êtes ici");
            } else {
                userMarker.setLatLng([lat, lng]);
            }

            // 2. Traitement de la liste textuelle et des marqueurs graphiques
            genererAffichageGisements(lat, lng);
        }

        function genererAffichageGisements(myLat, myLng) {
            if (typeof REPERTOIRE_GISEMENTS === 'undefined' || !map) return;

            const conteneurList = document.getElementById('listeGisements');
            conteneurList.innerHTML = ''; // Vide l'ancien texte d'attente

            // Calcul des distances et injection dans un tableau temporaire
            let gisementsAvecDistance = REPERTOIRE_GISEMENTS.map(g => {
                return { ...g, distance: calculerDistance(myLat, myLng, g.lat, g.lng) };
            });

            // Tri mathématique du plus proche au plus lointain
            gisementsAvecDistance.sort((a, b) => a.distance - b.distance);

            // Boucle de rendu (génère à la fois le point sur le radar ET la ligne dans la liste)
            gisementsAvecDistance.forEach(g => {
                // Rendu 1 : Affichage de la ligne dans la liste textuelle en bas
                const li = document.createElement('li');
                li.className = 'gisement-item';
                let affichageDist = g.distance < 1 
                    ? Math.round(g.distance * 1000) + " m" 
                    : g.distance.toFixed(1) + " km";

                li.innerHTML = `
                    <span class="gisement-dist">${affichageDist}</span>
                    <div class="gisement-name">${g.nom}</div>
                    <div class="gisement-desc">${g.details}</div>
                `;
                conteneurList.appendChild(li);
