<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: gap: blob:">
<title>Gemmes Pro - Radar</title>
<link rel="stylesheet" href="leaflet.css" />
<script src="leaflet.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;background:#1a1a2e;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#e2e2e2;overflow:hidden}
#main-container{display:flex;flex-direction:column;height:100%}
#map{height:55vh;width:100%;background:#0f172a;position:relative}
.panel-bas{height:45vh;background:#162447;border-top:3px solid #4facfe;box-sizing:border-box;padding:10px 15px;display:flex;flex-direction:column;overflow:hidden}
.header-panel{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
h1{color:#00f2fe;margin:0;text-transform:uppercase;font-size:16px}
.status-badge{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:bold;text-transform:uppercase}
.searching{background:#b83b5e;color:#fff}
.active{background:#00b16a;color:#fff}
.network{background:#e0a100;color:#fff}
.geo-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px;background:#1f4068;padding:6px;border-radius:4px;margin-bottom:8px}
.geo-item{font-family:monospace;color:#00f2fe}
.geo-item span:first-child{color:#84a9ac;font-family:sans-serif}
.filtre{background:#111b30;color:#e2e2e2;border:1px solid #4facfe;border-radius:4px;font-size:12px;padding:2px 4px}
#overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:2000;align-items:center;justify-content:center}
#overlay.ouvert{display:flex}
.modal{background:#162447;border:1px solid #4facfe;border-radius:8px;padding:14px;width:86%;max-width:360px;font-size:13px;box-sizing:border-box}
.modal input,.modal select,.modal textarea{width:100%;box-sizing:border-box;margin-top:6px;background:#111b30;color:#fff;border:1px solid #4facfe;border-radius:4px;padding:7px;font-size:14px;font-family:inherit}
.modal textarea{height:70px}
.modal .btns{display:flex;gap:8px;margin-top:10px}
.modal button{flex:1;padding:9px;border:0;border-radius:4px;font-size:14px;font-weight:bold;background:#4facfe;color:#0f172a}
.modal button.sec{background:#1f4068;color:#e2e2e2}
#guide{display:none;position:absolute;left:8px;right:8px;top:calc(55vh - 72px);z-index:900;background:rgba(22,36,71,.96);border:1px solid #00f2fe;border-radius:8px;padding:6px 10px;align-items:center;gap:10px;font-size:13px}
#guide.actif{display:flex}
#gFleche{font-size:30px;color:#00f2fe;transition:transform .3s;width:36px;text-align:center}
#guide button{margin-left:auto;background:#b83b5e;color:#fff;border:0;border-radius:4px;padding:6px 10px}
#toast{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:3000;background:rgba(0,0,0,.88);color:#fff;border:1px solid #00f2fe;border-radius:18px;padding:8px 14px;font-size:13px;max-width:88%;text-align:center}
#toast.visible{display:block}
.gisement-title{color:#4facfe;font-size:13px;font-weight:bold;text-transform:uppercase;margin-bottom:5px}
.gisements-list{flex:1;margin:0;padding:0;list-style:none;overflow-y:auto}
.gisement-item{background:#111b30;border-left:4px solid #b83b5e;margin-bottom:5px;padding:8px 10px;border-radius:0 4px 4px 0;font-size:13px}
.gisement-name{font-weight:bold;color:#fff}
.gisement-dist{float:right;color:#00f2fe;font-weight:bold;font-family:monospace}
.gisement-desc{font-size:11px;color:#84a9ac;margin-top:2px}
</style>
</head>
<body>
<div id="main-container">
  <div id="map"></div>
  <div class="panel-bas">
    <div class="header-panel">
      <h1>Gemmes Pro Radar</h1>
      <div id="status" class="status-badge searching">Initialisation...</div>
    </div>
    <div class="geo-grid">
      <div class="geo-item"><span>Pos: </span><span id="coordsAffichage">Recherche...</span></div>
      <div class="geo-item" style="text-align:right"><span>Précision: </span><span id="acc">--</span></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
      <div class="gisement-title" style="margin:0">📌 Gisements :</div>
      <select id="filtreType" class="filtre" onchange="changerFiltre(this.value)">
        <option value="tous">Tous</option>
        <option value="gemme">💎 Gemmes</option>
        <option value="metal">🪙 Métaux</option>
        <option value="mineral">🪨 Minéraux</option>
        <option value="fossile">🦴 Fossiles</option>
      </select>
    </div>
    <ul id="listeGisements" class="gisements-list">
      <li style="text-align:center;color:#84a9ac;padding-top:10px;font-size:12px">En attente de position...</li>
    </ul>
  </div>
</div>

<div id="guide"><div id="gFleche">⬆</div><div id="gTexte"></div><button onclick="arreterGuidage()">✖</button></div>
<div id="toast"></div>
<div id="overlay"><div class="modal" id="modal"></div></div>

<script src="gisements.js"></script>
<script src="cordova.js"></script>
<script>
let map = null, userMarker = null, carteEnCours = false;
let cercles = [], marqueursGis = [], derniereListe = [];
let filtreType = 'tous', derniereLat = null, derniereLng = null;
const TYPES = {
  gemme:   { label: 'Gemme',   color: '#a855f7' },
  metal:   { label: 'Métal',   color: '#f59e0b' },
  fossile: { label: 'Fossile', color: '#22c55e' },
  mineral: { label: 'Minéral', color: '#b83b5e' }
};
function typeGis(g) { return TYPES[g.type] ? g.type : 'mineral'; }

// ---------- Points personnels (sauvegarde locale sur le téléphone) ----------
const CLE_PERSO = 'gemmespro_perso';
let positionActuelle = null;
function esc(t) {
  return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function lirePerso() {
  try { return JSON.parse(localStorage.getItem(CLE_PERSO) || '[]'); } catch (e) { return []; }
}
function ecrirePerso(arr) {
  try { localStorage.setItem(CLE_PERSO, JSON.stringify(arr)); return true; } catch (e) { return false; }
}
if (typeof REPERTOIRE_GISEMENTS !== 'undefined') {
  lirePerso().forEach(p => REPERTOIRE_GISEMENTS.push(p));
}
let systemeDemarre = false, watchReseau = null, watchGPS = null;
let dernierGPS = 0, positionRecue = false;

function updateStatus(text, cls) {
  const el = document.getElementById('status');
  if (el) { el.textContent = text; el.className = 'status-badge ' + cls; }
}

function demarrerApplication() {
  if (systemeDemarre) return;
  systemeDemarre = true;
  lancerSuiviGPS();
  demarrerBoussole();
  appliquerEcranAllume();
}

// Deux suivis en parallèle : réseau/Wi-Fi (rapide) + GPS (précis)
function lancerSuiviGPS() {
  if (!navigator.geolocation) { updateStatus('GPS indisponible', 'searching'); return; }
  updateStatus('Recherche position...', 'searching');

  watchReseau = navigator.geolocation.watchPosition(
    p => onPosition(p, 'reseau'), onLocationError,
    { enableHighAccuracy: false, maximumAge: 30000, timeout: 20000 });

  watchGPS = navigator.geolocation.watchPosition(
    p => onPosition(p, 'gps'), onLocationError,
    { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}

document.addEventListener('deviceready', demarrerApplication, false);
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => { if (!systemeDemarre) demarrerApplication(); }, 1500);
});

function calculerDistance(lat1, lon1, lat2, lon2) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function onPosition(position, source) {
  const now = Date.now();
  if (source === 'gps') dernierGPS = now;
  else if (now - dernierGPS < 20000) return; // un fix GPS récent prime sur le réseau

  positionRecue = true;
  if (source === 'gps') updateStatus('GPS précis', 'active');
  else updateStatus('Position réseau', 'network');

  const lat = position.coords.latitude;
  const lng = position.coords.longitude;
  const acc = position.coords.accuracy;
  if (lat == null || lng == null) return;
  positionActuelle = { lat: lat, lng: lng, acc: acc || 0, source: source,
                       heading: position.coords.heading, speed: position.coords.speed };
  majGuidage();
  verifierProximite(positionActuelle);

  document.getElementById('coordsAffichage').textContent = lat.toFixed(4) + ' , ' + lng.toFixed(4);
  document.getElementById('acc').textContent = (acc != null ? acc.toFixed(0) : '--') + ' m';

  if (!map) initCarte(lat, lng); else majCarte(lat, lng);
  genererAffichageGisements(lat, lng);
}

function initCarte(lat, lng) {
  if (carteEnCours || typeof L === 'undefined') return;
  carteEnCours = true;
  setTimeout(() => {
    try {
      map = L.map('map', { zoomControl: true, attributionControl: true }).setView([lat, lng], 11);
      map.attributionControl.setPrefix(false);
      [2000, 5000, 10000].forEach(r => {
        cercles.push(L.circle([lat, lng], { radius: r, color: '#4facfe', weight: 1, fill: false, dashArray: '5, 5' }).addTo(map));
      });
      userMarker = L.circleMarker([lat, lng], {
        radius: 9, color: '#fff', weight: 2, fillColor: '#00f2fe', fillOpacity: 1
      }).addTo(map).bindPopup('Vous êtes ici');

      if (typeof REPERTOIRE_GISEMENTS !== 'undefined') {
        REPERTOIRE_GISEMENTS.forEach(g => marqueursGis.push(creerMarqueur(g)));
      }
      // Fond de carte (uniquement si réseau ; sinon le fond bleu nuit reste)
      new TuilesHorsLigne(URL_PLAN, { maxZoom: 18, maxNativeZoom: 18, opacity: 0.85, attribution: 'Carte © IGN/Géoplateforme' }).addTo(map);
      ajouterBoutons();
      ajouterBoussole();
      majBoutonsEtat();
      map.invalidateSize();
      cadrerProches(3);
    } catch (e) {
      console.log('Erreur carte : ' + e.message);
      carteEnCours = false;
    }
  }, 100);
}

function majCarte(lat, lng) {
  if (userMarker) userMarker.setLatLng([lat, lng]);
  cercles.forEach(c => c.setLatLng([lat, lng]));
}

function bouton(txt, fn) {
  const b = document.createElement('button');
  b.textContent = txt;
  b.style.cssText = 'padding:6px 8px;border:0;border-radius:4px;background:#4facfe;color:#0f172a;font-weight:bold;font-size:13px';
  b.addEventListener('click', fn);
  return b;
}

function creerMarqueur(g) {
  const t = TYPES[typeGis(g)];
  const m = L.circleMarker([g.lat, g.lng], {
    radius: g.perso ? 9 : 7, color: g.perso ? '#00f2fe' : '#fff', weight: g.perso ? 3 : 1,
    fillColor: t.color, fillOpacity: 0.9
  }).addTo(map);
  m.bindPopup(function () {
    const d = document.createElement('div');
    d.innerHTML = '<b>' + (g.perso ? '★ ' : '') + esc(g.nom) + '</b> (' + t.label + ')<br>' + esc(g.details) +
      (g.perso ? '<br><small>' + esc(g.date) + ' · ±' + g.acc + ' m</small>' : '');
    const bar = document.createElement('div');
    bar.style.cssText = 'margin-top:8px;display:flex;gap:6px;flex-wrap:wrap';
    bar.appendChild(bouton('🧭 Guider', function () { guiderVers(g); m.closePopup(); }));
    bar.appendChild(bouton('🚗 Route', function () { ouvrirItineraire(g); }));
    if (g.perso) bar.appendChild(bouton('🗑', function () { supprimerPerso(g.id); }));
    d.appendChild(bar);
    return d;
  });
  if (filtreType !== 'tous' && typeGis(g) !== filtreType) map.removeLayer(m);
  return m;
}

// ---------- Guidage vers un gisement ----------
let cible = null, ligneGuide = null;
let capBoussole = null, dernierMajBoussole = 0;

// ---------- Boussole (capteur magnétique du téléphone, sans plugin) ----------
function capDepuisOrientation(alpha, beta, gamma) {
  // Formule W3C : cap corrigé de l'inclinaison du téléphone (à plat ou tenu droit)
  const r = Math.PI / 180, a = alpha * r, b = beta * r, g = gamma * r;
  const cA = Math.cos(a), sA = Math.sin(a), cB = Math.cos(b), sB = Math.sin(b), cG = Math.cos(g), sG = Math.sin(g);
  const rA = -cA * sG - sA * sB * cG;
  const rB = -sA * sG + cA * sB * cG;
  let h = Math.atan(rA / rB);
  if (rB < 0) h += Math.PI; else if (rA < 0) h += 2 * Math.PI;
  return (h / r + 360) % 360;
}

function lisserAngle(ancien, nouveau, k) {
  const diff = ((nouveau - ancien + 540) % 360) - 180;
  return (ancien + diff * k + 360) % 360;
}

function demarrerBoussole() {
  const gestion = function (e) {
    if (e.alpha == null) return;
    let cap = null;
    if (e.webkitCompassHeading != null) cap = e.webkitCompassHeading;
    else if (e.absolute === true || e.type === 'deviceorientationabsolute') cap = capDepuisOrientation(e.alpha, e.beta, e.gamma);
    if (cap == null || isNaN(cap)) return;
    capBoussole = capBoussole == null ? cap : lisserAngle(capBoussole, cap, 0.25);
    const now = Date.now();
    if (now - dernierMajBoussole < 120) return; // limite la fréquence d'affichage
    dernierMajBoussole = now;
    rafraichirBoussole();
  };
  window.addEventListener('deviceorientationabsolute', gestion, true);
  window.addEventListener('deviceorientation', gestion, true);
}

function rafraichirBoussole() {
  if (capBoussole == null) return;
  const a = document.getElementById('bAiguille'), t = document.getElementById('bCap');
  if (a) a.style.transform = 'rotate(' + (-capBoussole) + 'deg)';
  if (t) t.textContent = Math.round(capBoussole) + '° ' + pointCardinal(capBoussole);
  majGuidage();
}

function ajouterBoussole() {
  const C = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function () {
      const d = L.DomUtil.create('div');
      d.style.cssText = 'width:62px;height:62px;border-radius:50%;background:rgba(22,36,71,.92);border:2px solid #4facfe;position:relative;color:#fff;margin-top:6px';
      d.innerHTML =
        '<div id="bAiguille" style="position:absolute;left:0;top:0;width:100%;height:100%;transition:transform .12s">' +
        '<div style="text-align:center;color:#ff5a5a;font-weight:bold;font-size:12px;line-height:14px">N</div>' +
        '<div style="position:absolute;left:50%;top:14px;margin-left:-4px;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:12px solid #ff5a5a"></div></div>' +
        '<div id="bCap" style="position:absolute;left:0;right:0;top:50%;margin-top:-5px;text-align:center;font-family:monospace;font-size:10px;color:#00f2fe">--</div>';
      L.DomEvent.disableClickPropagation(d);
      return d;
    }
  });
  map.addControl(new C());
}

function calculerCap(lat1, lon1, lat2, lon2) {
  const r = Math.PI / 180;
  const y = Math.sin((lon2 - lon1) * r) * Math.cos(lat2 * r);
  const x = Math.cos(lat1 * r) * Math.sin(lat2 * r) -
            Math.sin(lat1 * r) * Math.cos(lat2 * r) * Math.cos((lon2 - lon1) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}
function pointCardinal(b) { return ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'][Math.round(b / 45) % 8]; }

function guiderVers(g) {
  cible = g;
  document.getElementById('guide').className = 'actif';
  if (!positionActuelle) document.getElementById('gTexte').textContent = 'En attente de position...';
  majGuidage();
}

function arreterGuidage() {
  cible = null;
  if (ligneGuide && map) { map.removeLayer(ligneGuide); }
  ligneGuide = null;
  document.getElementById('guide').className = '';
}

function majGuidage() {
  if (!cible || !positionActuelle) return;
  const p = positionActuelle;
  const dKm = calculerDistance(p.lat, p.lng, cible.lat, cible.lng);
  const cap = calculerCap(p.lat, p.lng, cible.lat, cible.lng);
  const dTxt = dKm < 1 ? Math.round(dKm * 1000) + ' m' : dKm.toFixed(1) + ' km';
  const enMarche = p.heading != null && !isNaN(p.heading) && p.speed > 0.7;
  let rot, mode;
  if (capBoussole != null) { rot = (cap - capBoussole + 360) % 360; mode = 'devant vous (boussole)'; }
  else if (enMarche) { rot = (cap - p.heading + 360) % 360; mode = 'devant vous (GPS)'; }
  else { rot = cap; mode = 'Nord en haut'; }
  const arrive = dKm * 1000 < Math.max(30, p.acc);
  const fl = document.getElementById('gFleche');
  fl.style.transform = 'rotate(' + rot + 'deg)';
  fl.style.color = (mode !== 'Nord en haut' && (rot < 15 || rot > 345)) ? '#00ff88' : '#00f2fe';
  document.getElementById('gTexte').innerHTML = '<b>' + esc(cible.nom) + '</b><br>' +
    (arrive ? '🎯 Vous êtes dans la zone' : dTxt + ' · cap ' + Math.round(cap) + '° ' + pointCardinal(cap)) +
    '<br><small>' + 'Flèche : ' + mode + ' · à vol d’oiseau</small>';
  if (map) {
    const pts = [[p.lat, p.lng], [cible.lat, cible.lng]];
    if (!ligneGuide) ligneGuide = L.polyline(pts, { color: '#00f2fe', weight: 3, dashArray: '6,8' }).addTo(map);
    else ligneGuide.setLatLngs(pts);
  }
}

function ouvrirItineraire(g) {
  // Ouvre l'application de navigation du téléphone (Google Maps, OsmAnd, Organic Maps...)
  window.location.href = 'geo:' + g.lat + ',' + g.lng + '?q=' + g.lat + ',' + g.lng + '(' + encodeURIComponent(g.nom) + ')';
}

function ouvrirModal(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('overlay').className = 'ouvert';
}
function fermerModal() { document.getElementById('overlay').className = ''; }

function ouvrirFormulaire() {
  const p = positionActuelle;
  if (!p) { alert('Position non disponible : attendez le signal.'); return; }
  const opts = Object.keys(TYPES).map(k => '<option value="' + k + '">' + TYPES[k].label + '</option>').join('');
  ouvrirModal(
    '<b style="color:#00f2fe">➕ Marquer ce point</b>' +
    '<div style="margin:6px 0;font-family:monospace;color:#00f2fe">' + p.lat.toFixed(5) + ' , ' + p.lng.toFixed(5) +
    ' (±' + Math.round(p.acc) + ' m)</div>' +
    (p.acc > 50 ? '<div style="color:#f59e0b">⚠ Précision faible (' + (p.source === 'gps' ? 'GPS' : 'réseau') +
      '). Attendez le GPS pour un point plus exact.</div>' : '') +
    '<input id="pNom" placeholder="Minéral / nom du lieu" />' +
    '<select id="pType">' + opts + '</select>' +
    '<textarea id="pNotes" placeholder="Notes (couleur, taille, accès...)"></textarea>' +
    '<div class="btns"><button class="sec" onclick="fermerModal()">Annuler</button>' +
    '<button onclick="enregistrerPoint()">Enregistrer</button></div>');
}

function enregistrerPoint() {
  const p = positionActuelle;
  if (!p) return;
  const g = {
    id: Date.now(), perso: true,
    nom: document.getElementById('pNom').value.trim() || 'Point sans nom',
    type: document.getElementById('pType').value,
    details: document.getElementById('pNotes').value.trim(),
    lat: +p.lat.toFixed(6), lng: +p.lng.toFixed(6),
    date: new Date().toLocaleDateString('fr-FR'), acc: Math.round(p.acc)
  };
  const arr = lirePerso(); arr.push(g);
  if (!ecrirePerso(arr)) alert('Sauvegarde impossible sur ce téléphone.');
  REPERTOIRE_GISEMENTS.push(g);
  if (map && marqueursGis.length === REPERTOIRE_GISEMENTS.length - 1) marqueursGis.push(creerMarqueur(g));
  genererAffichageGisements(derniereLat !== null ? derniereLat : p.lat, derniereLng !== null ? derniereLng : p.lng);
  fermerModal();
}

function supprimerPerso(id) {
  if (!confirm('Supprimer ce point ?')) return;
  ecrirePerso(lirePerso().filter(x => x.id !== id));
  if (cible && cible.id === id) arreterGuidage();
  const idx = REPERTOIRE_GISEMENTS.findIndex(x => x.id === id);
  if (idx >= 0) {
    REPERTOIRE_GISEMENTS.splice(idx, 1);
    if (marqueursGis[idx]) { if (map) map.removeLayer(marqueursGis[idx]); marqueursGis.splice(idx, 1); }
  }
  if (map) map.closePopup();
  if (derniereLat !== null) genererAffichageGisements(derniereLat, derniereLng);
}

function ouvrirExport() {
  const arr = lirePerso();
  if (!arr.length) { alert('Aucun point personnel enregistré.'); return; }
  const txt = '// À coller dans gisements.js, avant la ligne finale "];"\n' +
    arr.map(x => '    ' + JSON.stringify({ nom: x.nom, lat: x.lat, lng: x.lng, type: x.type,
      details: (x.details ? x.details + ' ' : '') + '(point terrain ' + x.date + ', ±' + x.acc + ' m)' }) + ',').join('\n');
  ouvrirModal('<b style="color:#00f2fe">📤 Mes points (' + arr.length + ')</b>' +
    '<textarea id="pExport" style="height:150px;font-size:11px;font-family:monospace" readonly>' + esc(txt) + '</textarea>' +
    '<div class="btns"><button class="sec" onclick="fermerModal()">Fermer</button>' +
    '<button onclick="copierExport()">Copier</button></div>');
}
function copierExport() {
  const t = document.getElementById('pExport');
  t.select();
  try { document.execCommand('copy'); alert('Copié.'); } catch (e) { alert('Sélectionnez et copiez le texte manuellement.'); }
}

// ---------- Utilitaires : message flottant, vibreur ----------
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg; t.className = 'visible';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = ''; }, 4000);
}
function vibrer(motif) { try { if (navigator.vibrate) navigator.vibrate(motif); } catch (e) {} }

// ---------- Écran toujours allumé ----------
let ecranAllume = (function () { try { return localStorage.getItem('gp_ecran') !== '0'; } catch (e) { return true; } })();
let wakeLockObj = null;
function appliquerEcranAllume() {
  try {
    if (window.plugins && window.plugins.insomnia) {
      if (ecranAllume) window.plugins.insomnia.keepAwake(); else window.plugins.insomnia.allowSleepAgain();
    } else if (navigator.wakeLock) {
      if (ecranAllume) navigator.wakeLock.request('screen').then(function (l) { wakeLockObj = l; }).catch(function () {});
      else if (wakeLockObj) { wakeLockObj.release(); wakeLockObj = null; }
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && ecranAllume) appliquerEcranAllume(); });
function basculerEcran() {
  ecranAllume = !ecranAllume;
  try { localStorage.setItem('gp_ecran', ecranAllume ? '1' : '0'); } catch (e) {}
  appliquerEcranAllume(); majBoutonsEtat();
  toast(ecranAllume ? '💡 Écran maintenu allumé' : '💡 Mise en veille normale');
}

// ---------- Alertes de proximité par vibreur ----------
const RAYONS = [0, 100, 300, 1000];
let rayonAlerte = (function () {
  try { const v = parseInt(localStorage.getItem('gp_rayon')); return RAYONS.indexOf(v) >= 0 ? v : 300; } catch (e) { return 300; }
})();
let etatProche = {}, etatArrive = {};
function changerAlerte() {
  rayonAlerte = RAYONS[(RAYONS.indexOf(rayonAlerte) + 1) % RAYONS.length];
  try { localStorage.setItem('gp_rayon', String(rayonAlerte)); } catch (e) {}
  etatProche = {}; etatArrive = {};
  majBoutonsEtat();
  toast(rayonAlerte ? '🔔 Alerte vibreur à ' + (rayonAlerte >= 1000 ? '1 km' : rayonAlerte + ' m') : '🔕 Alertes désactivées');
  if (rayonAlerte) vibrer([120]);
}
function verifierProximite(p) {
  if (!rayonAlerte || typeof REPERTOIRE_GISEMENTS === 'undefined') return;
  if (p.acc > Math.max(60, rayonAlerte)) return; // position trop imprécise : pas d'alerte
  REPERTOIRE_GISEMENTS.forEach(function (g) {
    if (filtreType !== 'tous' && typeGis(g) !== filtreType) return;
    const k = g.id || (g.nom + g.lat);
    const dm = calculerDistance(p.lat, p.lng, g.lat, g.lng) * 1000;
    if (dm <= Math.max(30, p.acc)) {
      if (!etatArrive[k]) { etatArrive[k] = true; etatProche[k] = true; vibrer([500, 150, 500, 150, 500]); toast('🎯 Vous y êtes : ' + g.nom); }
    } else if (dm <= rayonAlerte) {
      if (!etatProche[k]) { etatProche[k] = true; vibrer([250, 120, 250]); toast('📍 ' + g.nom + ' à ' + Math.round(dm) + ' m'); }
    }
    if (dm > rayonAlerte * 1.5) etatProche[k] = false;
    if (dm > 100) etatArrive[k] = false;
  });
}
function majBoutonsEtat() {
  const e = document.getElementById('btnEcran'), a = document.getElementById('btnAlerte');
  if (e) e.style.opacity = ecranAllume ? '1' : '0.45';
  if (a) { a.innerHTML = rayonAlerte ? '🔔' : '🔕'; a.style.opacity = rayonAlerte ? '1' : '0.45'; }
}

// ---------- Fond de carte IGN avec mémoire hors ligne ----------
const URL_PLAN = 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0' +
  '&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&FORMAT=image/png&TILEMATRIXSET=PM' +
  '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
const MAX_TUILES = 4000;
let dbTuiles = null, dlEnCours = false, dlAnnule = false;

function urlTuile(z, x, y) { return URL_PLAN.replace('{z}', z).replace('{x}', x).replace('{y}', y); }

function ouvrirDB() {
  return new Promise(function (res) {
    if (dbTuiles) return res(dbTuiles);
    try {
      const rq = indexedDB.open('gemmespro_tuiles', 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore('t'); };
      rq.onsuccess = function () { dbTuiles = rq.result; res(dbTuiles); };
      rq.onerror = function () { res(null); };
    } catch (e) { res(null); }
  });
}
function opDB(mode, fn) {
  return ouvrirDB().then(function (db) {
    return new Promise(function (res) {
      if (!db) return res(null);
      try {
        const tx = db.transaction('t', mode), st = tx.objectStore('t');
        const rq = fn(st);
        tx.oncomplete = function () { res(rq ? rq.result : true); };
        tx.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  });
}
function lireTuile(key) { return opDB('readonly', function (st) { return st.get(key); }); }
function existeTuile(key) { return opDB('readonly', function (st) { return st.count(key); }).then(function (n) { return n > 0; }); }
function ecrireTuile(key, blob) { return opDB('readwrite', function (st) { return st.put(blob, key); }); }
function compterTuiles() { return opDB('readonly', function (st) { return st.count(); }).then(function (n) { return n || 0; }); }
function viderTuiles() { return opDB('readwrite', function (st) { return st.clear(); }); }

const TuilesHorsLigne = (typeof L === 'undefined') ? null : L.TileLayer.extend({
  createTile: function (coords, done) {
    const img = document.createElement('img');
    img.alt = ''; img.setAttribute('role', 'presentation');
    const url = this.getTileUrl(coords);
    lireTuile(coords.z + '/' + coords.x + '/' + coords.y).then(function (blob) {
      if (blob) {
        const u = URL.createObjectURL(blob);
        img.onload = function () { URL.revokeObjectURL(u); done(null, img); };
        img.onerror = function () { done(null, img); };
        img.src = u;
      } else {
        img.onload = function () { done(null, img); };
        img.onerror = function () { done(null, img); };
        img.src = url;
      }
    });
    return img;
  }
});

function tuileX(lng, z) { return Math.floor((lng + 180) / 360 * Math.pow(2, z)); }
function tuileY(lat, z) {
  const r = lat * Math.PI / 180;
  return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z));
}
function listerTuiles(zmax) {
  const b = map.getBounds(), zmin = Math.max(7, zmax - 5), liste = [];
  for (let z = zmin; z <= zmax; z++) {
    const x0 = tuileX(b.getWest(), z), x1 = tuileX(b.getEast(), z);
    const y0 = tuileY(b.getNorth(), z), y1 = tuileY(b.getSouth(), z);
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
      liste.push({ z: z, x: x, y: y });
      if (liste.length > MAX_TUILES) return liste;
    }
  }
  return liste;
}

function ouvrirCartes() {
  if (!map) return;
  ouvrirModal('<b style="color:#00f2fe">📥 Carte hors ligne (IGN)</b>' +
    '<div style="margin:6px 0;color:#84a9ac">Télécharge la partie <b>visible</b> de la carte. Zoomez d’abord sur votre secteur de prospection, avec du réseau.</div>' +
    '<select id="dlZoom" onchange="majEstimation()">' +
    '<option value="13">Moyen (z13)</option><option value="14">Bon (z14)</option>' +
    '<option value="15" selected>Détaillé (z15)</option><option value="16">Très détaillé (z16)</option></select>' +
    '<div id="dlInfo" style="margin:8px 0">...</div>' +
    '<div id="dlCache" style="color:#84a9ac;font-size:12px"></div>' +
    '<div class="btns"><button class="sec" onclick="fermerModal()">Fermer</button>' +
    '<button id="dlBtn" onclick="lancerTelechargement()">Télécharger</button></div>' +
    '<button class="sec" style="margin-top:8px;width:100%" onclick="viderCache()">🗑 Effacer les cartes mémorisées</button>');
  majEstimation();
}

function majEstimation() {
  const sel = document.getElementById('dlZoom');
  if (!sel || !map || dlEnCours) return;
  const l = listerTuiles(parseInt(sel.value));
  const info = document.getElementById('dlInfo'), btn = document.getElementById('dlBtn');
  if (l.length > MAX_TUILES) {
    info.textContent = '⚠ Zone trop grande (plus de ' + MAX_TUILES + ' tuiles). Zoomez sur votre secteur ou choisissez moins de détail.';
    btn.disabled = true;
  } else {
    info.textContent = l.length + ' tuiles ≈ ' + Math.max(1, Math.round(l.length * 0.02)) + ' Mo';
    btn.disabled = false;
  }
  compterTuiles().then(function (n) {
    const el = document.getElementById('dlCache');
    if (el) el.textContent = 'Déjà en mémoire : ' + n + ' tuiles';
  });
}

async function lancerTelechargement() {
  if (dlEnCours) return;
  if (!navigator.onLine) { alert('Pas de connexion internet.'); return; }
  const liste = listerTuiles(parseInt(document.getElementById('dlZoom').value));
  if (!liste.length || liste.length > MAX_TUILES) return;
  dlEnCours = true; dlAnnule = false;
  let i = 0, faits = 0, reussies = 0, erreurs = 0, echecTotal = false;
  const btn = document.getElementById('dlBtn');
  btn.textContent = 'Annuler'; btn.onclick = function () { dlAnnule = true; };
  async function worker() {
    while (!dlAnnule) {
      const idx = i++;
      if (idx >= liste.length) break;
      const t = liste[idx], key = t.z + '/' + t.x + '/' + t.y;
      try {
        if (!(await existeTuile(key))) {
          const r = await fetch(urlTuile(t.z, t.x, t.y));
          if (!r.ok) throw new Error('HTTP ' + r.status);
          await ecrireTuile(key, await r.blob());
        }
        reussies++;
      } catch (e) {
        erreurs++;
        if (erreurs >= 8 && reussies === 0) { echecTotal = true; dlAnnule = true; }
      }
      faits++;
      const el = document.getElementById('dlInfo');
      if (el) el.textContent = 'Téléchargement : ' + faits + ' / ' + liste.length + (erreurs ? ' (' + erreurs + ' erreurs)' : '');
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  dlEnCours = false;
  if (echecTotal) toast('⚠ Téléchargement impossible : serveur injoignable ou refus depuis l’application');
  else if (dlAnnule) toast('Téléchargement annulé (' + reussies + ' tuiles gardées)');
  else toast('✔ Carte hors ligne prête : ' + reussies + ' tuiles' + (erreurs ? ' (' + erreurs + ' erreurs)' : ''));
  if (document.getElementById('dlZoom')) ouvrirCartes();
}

function viderCache() {
  if (dlEnCours || !confirm('Effacer toutes les cartes mémorisées ?')) return;
  viderTuiles().then(function () { toast('Cartes effacées'); majEstimation(); });
}

function changerFiltre(v) {
  filtreType = v;
  if (map) marqueursGis.forEach((m, i) => {
    const visible = v === 'tous' || typeGis(REPERTOIRE_GISEMENTS[i]) === v;
    if (visible) map.addLayer(m); else map.removeLayer(m);
  });
  if (derniereLat !== null) genererAffichageGisements(derniereLat, derniereLng);
  cadrerProches(3);
}

function cadrerProches(n) {
  if (!map || !userMarker || !derniereListe.length) return;
  const pts = [userMarker.getLatLng()].concat(
    derniereListe.slice(0, n).map(x => L.latLng(x.g.lat, x.g.lng)));
  map.fitBounds(L.latLngBounds(pts), { padding: [30, 30], maxZoom: 13 });
}

function cadrerTous() {
  if (!map || !userMarker || typeof REPERTOIRE_GISEMENTS === 'undefined') return;
  const pts = [userMarker.getLatLng()].concat(
    REPERTOIRE_GISEMENTS.filter(g => filtreType === 'tous' || typeGis(g) === filtreType).map(g => L.latLng(g.lat, g.lng)));
  map.fitBounds(L.latLngBounds(pts), { padding: [30, 30] });
}

function allerA(i) {
  if (!map || !marqueursGis[i]) return;
  map.setView(marqueursGis[i].getLatLng(), 12);
  marqueursGis[i].openPopup();
}

function ajouterBoutons() {
  const Ctl = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      const d = L.DomUtil.create('div');
      d.style.cssText = 'display:flex;flex-direction:column;gap:4px';
      [['📍', function () { if (userMarker) map.setView(userMarker.getLatLng(), 13); }],
       ['🎯', function () { cadrerProches(3); }],
       ['🌍', cadrerTous],
       ['➕', ouvrirFormulaire],
       ['📤', ouvrirExport],
       ['📥', ouvrirCartes],
       ['💡', basculerEcran, 'btnEcran'],
       ['🔔', changerAlerte, 'btnAlerte']].forEach(function (b) {
        const a = L.DomUtil.create('a', '', d);
        a.innerHTML = b[0]; a.href = '#'; if (b[2]) a.id = b[2];
        a.style.cssText = 'background:#fff;width:32px;height:32px;line-height:32px;text-align:center;font-size:18px;border-radius:4px;text-decoration:none';
        L.DomEvent.on(a, 'click', function (e) { L.DomEvent.preventDefault(e); b[1](); });
      });
      L.DomEvent.disableClickPropagation(d);
      return d;
    }
  });
  map.addControl(new Ctl());
}

function genererAffichageGisements(lat, lng) {
  derniereLat = lat; derniereLng = lng;
  const ul = document.getElementById('listeGisements');
  if (!ul || typeof REPERTOIRE_GISEMENTS === 'undefined') return;
  const liste = REPERTOIRE_GISEMENTS
    .map((g, i) => ({ g: g, i: i, d: calculerDistance(lat, lng, g.lat, g.lng) }))
    .filter(x => filtreType === 'tous' || typeGis(x.g) === filtreType)
    .sort((a, b) => a.d - b.d);
  derniereListe = liste;
  ul.innerHTML = liste.map(x =>
    '<li class="gisement-item" style="border-left-color:' + TYPES[typeGis(x.g)].color + '" onclick="allerA(' + x.i + ')">' +
    '<span class="gisement-name">' + (x.g.perso ? '★ ' : '') + esc(x.g.nom) + '</span>' +
    '<span class="gisement-dist">' + x.d.toFixed(1) + ' km</span>' +
    '<div class="gisement-desc">' + TYPES[typeGis(x.g)].label + ' · ' + esc(x.g.details) + '</div></li>').join('');
}

function onLocationError(err) {
  if (positionRecue) return; // une position valide existe déjà, on ignore
  const msgs = { 1: 'Permission refusée', 2: 'Position indisponible', 3: 'Délai dépassé' };
  updateStatus(msgs[err.code] || 'Erreur GPS', 'searching');
  console.log('Geoloc erreur ' + err.code + ' : ' + err.message);
}
</script>
