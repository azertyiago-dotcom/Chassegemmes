<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    
    <!-- Sécurité Android : Autorise le fonctionnement en circuit fermé local -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';">

    <title>Gemmes Pro - Version Terrain Autonome</title>
    
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e2e2;
            overflow: hidden;
        }
        #main-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
            background-color: #0f172a; /* Fond bleu nuit radar */
        }
        .panel-inférieur {
            background-color: #162447;
            border-top: 3px solid #4facfe;
            padding: 12px 20px;
            z-index: 10;
        }
        h1 {
            color: #00f2fe;
            margin: 0 0 4px 0;
            text-transform: uppercase;
            font-size: 18px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .searching { background-color: #b83b5e; color: #fff; }
        .active { background-color: #00b16a; color: #fff; }
        
        .geo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
            background: #1f4068;
            padding: 8px;
            border-radius: 6px;
        }
        .geo-item { font-family: monospace; color: #00f2fe; }
        .geo-item span { color: #84a9ac; font-family: sans-serif; }
    </style>
</head>
<body>

    <div id="main-container">
        <!-- Zone radar radar de prospection -->
        <div id="map"></div>

        <div class="panel-inférieur">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>Gemmes Pro Radar</h1>
                <div id="status" class="status-badge searching">Initialisation...</div>
            </div>
            <div class="geo-grid">
                <div class="geo-item"><span>GPS:</span><span id="coordsAffichage">Recherche...</span></div>
                <div class="geo-item" style="text-align: right;"><span>Précision:</span><span id="acc">--</span></div>
            </div>
        </div>
    </div>

    <script src="gisements.js"></script>
    <script src="cordova.js"></script>
    
    <script>
        let map = null;
        let userMarker = null;
        let systemeDemarre = false;
        let gisementsCalcules = [];

        function updateStatus(text, statusClass) {
            const el = document.getElementById('status');
            if (el) {
                el.textContent = text;
                el.className = 'status-badge ' + statusClass;
            }
        }

        function demarrerApplication() {
            if (systemeDemarre) return;
            systemeDemarre = true;

            updateStatus('Recherche satellites...', 'searching');
            
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(onLocationSuccess, onLocationError, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                });
            } else {
                updateStatus('Erreur GPS', 'searching');
            }
        }

        document.addEventListener('deviceready', demarrerApplication, false);
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { if (!systemeDemarre) demarrerApplication(); }, 1500);
        });

        // FORMULE DE HAVERSINE : Calcul de distance de prospection
        function calculerDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function onLocationSuccess(position) {
            updateStatus('Radar Actif', 'active');
            
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            
            document.getElementById('coordsAffichage').textContent = lat.toFixed(4) + " , " + lng.toFixed(4);
            document.getElementById('acc').textContent = accuracy.toFixed(0) + ' m';

            // Initialisation de la carte en mode Radar Vectoriel (sans TileLayer internet)
            if (!map) {
                map = L.map('map', { 
                    zoomControl: true,
                    attributionControl: false 
                }).setView([lat, lng], 11);

                // CORRECTION RADICALE : Dessin d'une grille de cercles concentriques (cercles de distance de 5km, 10km, 20km)
                L.circle([lat, lng], { radius: 2000, color: '#4facfe', weight: 1, fill: false, dashArray: '5, 5' }).addTo(map);
                L.circle([lat, lng], { radius: 5000, color: '#4facfe', weight: 1, fill: false, dashArray: '5, 5' }).addTo(map);
                L.circle([lat, lng], { radius: 10000, color: '#4facfe', weight: 1, fill: false, dashArray: '5, 5' }).addTo(map);

                chargerMarqueursGisements(lat, lng);
            }

            if (!userMarker) {
                userMarker = L.circleMarker([lat, lng], {
                    radius: 10,
                    color: '#ffffff',
                    weight: 2,
                    fillColor: '#00f2fe',
                    fillOpacity: 1
                }).addTo(map).bindPopup("<b>Ma Position de Prospection</b>").openPopup();
            } else {
                userMarker.setLatLng([lat, lng]);
            }
        }

        function chargerMarqueursGisements(myLat, myLng) {
            if (typeof REPERTOIRE_GISEMENTS !== 'undefined' && map) {
                REPERTOIRE_GISEMENTS.forEach(g => {
                    // Calcul de la distance réelle entre vous et le gisement
                    const distanceGis = calculerDistance(myLat, myLng, g.lat, g.lng);
                    let affichageDist = distanceGis < 1 
                        ? Math.round(distanceGis * 1000) + " m" 
                        : distanceGis.toFixed(1) + " km";

                    // Affichage sous forme de balise géométrique locale
                    L.circleMarker([g.lat, g.lng], {
                        radius: 8,
                        color: '#1a1a2e',
                        weight: 1,
                        fillColor: '#b83b5e',
                        fillOpacity: 0.9
                    }).addTo(map)
                      .bindPopup(`<b>${g.nom}</b><br><span style="color:#00f2fe;font-weight:bold;">Distance : ${affichageDist}</span><br><span style="font-size:11px;color:#ccc;">${g.details}</span>`);
                });
            }
        }

        function onLocationError(error) {
            updateStatus('Recherche signal...', 'searching');
        }
    </script>
</body>
</html>
