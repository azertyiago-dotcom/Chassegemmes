<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chasseur de Gemmes Pro</title>
    
    <!-- Intégration locale de Leaflet pour éviter les pannes hors-ligne -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; }
        #map { height: 65vh; width: 100vw; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        #controls { height: 35vh; padding: 15px; box-sizing: border-box; overflow-y: auto; }
        .btn { background: #007bff; color: white; padding: 14px; border: none; border-radius: 8px; width: 100%; margin-bottom: 10px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-success { background: #28a745; }
        .btn-warning { background: #ffc107; color: #212529; }
        #status-panel { background: #fff; padding: 10px; border-radius: 8px; border-left: 5px solid #007bff; margin-bottom: 10px; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .badge { display: inline-block; padding: 3px 7px; background: #dc3545; color: white; border-radius: 4px; font-size: 11px; }
        .badge-online { background: #28a745; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div id="controls">
        <div id="status-panel">
            <b>Réseau :</b> <span id="net-status" class="badge">Hors-ligne</span> | 
            <b>GPS :</b> <span id="gps-status">Recherche du signal...</span>
        </div>

        <button class="btn btn-success" onclick="marquerMaTrouvaille()">💎 Enregistrer une découverte ici</button>
        <button class="btn btn-warning" onclick="telechargerZoneCarte()">💾 Mettre en cache la zone visible (Wi-Fi requis)</button>
    </div>

    <!-- Script Cordova Natif chargé automatiquement à la compilation APK -->
    <script src="cordova.js"></script>
    <script>
        let map, marqueurUtilisateur, positionUtilisateur = null;
        let gisementsFrance = [
            { name: "Mine de Pégut (Améthyste)", lat: 45.4352, lng: 3.4214, type: "Améthyste" },
            { name: "Filons du Vernet-la-Varenne (Améthyste)", lat: 45.4745, lng: 3.4512, type: "Améthyste" },
            { name: "Mine de l'Avellan (Fluorite/Quartz)", lat: 43.5382, lng: 6.7854, type: "Fluorite" },
            { name: "Gisement de Lantignié (Fluorite)", lat: 46.1601, lng: 4.6225, type: "Fluorite" },
            { name: "Indices du Beaufortain (Grenat Almandin)", lat: 45.7291, lng: 6.5743, type: "Grenat" },
            { name: "Alluvions d'Issoire (Saphir historique)", lat: 45.5439, lng: 3.2484, type: "Saphir" },
            { name: "Massif de l'Oisans (Quartz Fumé)", lat: 45.0562, lng: 6.1245, type: "Quartz" },
            { name: "Glacier du Mont-Blanc (Quartz/Fluorine)", lat: 45.9227, lng: 6.8685, type: "Quartz" },
            { name: "Côte de Ploumanac'h (Tourmaline)", lat: 48.8315, lng: -3.4831, type: "Tourmaline" },
            { name: "Anciennes mines de Cap Garonne (Azurite)", lat: 43.0833, lng: 6.0333, type: "Azurite" }
        ];
        let mesTrouvailles = JSON.parse(localStorage.getItem('mesTrouvailles')) || [];

        // Attendre que le système Android natif soit prêt
        document.addEventListener('deviceready', onDeviceReady, false);

        function onDeviceReady() {
            // 1. Activation immédiate du mode Arrière-plan permanent (Anti-veille ultime)
            if (window.cordova && cordova.plugins && cordova.plugins.backgroundMode) {
                cordova.plugins.backgroundMode.enable();
                cordova.plugins.backgroundMode.setDefaults({
                    title: "Chasseur de Gemmes Pro",
                    text: "Calculateur GPS actif à 100km en arrière-plan.",
                    icon: 'icon',
                    color: 'F1C40F'
                });
            }

            // 2. Initialisation de la carte
            map = L.map('map').setView([46.2276, 2.2137], 6);
            
            // Mode hybride : cherche d'abord dans le cache du téléphone, sinon télécharge sur le web
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                useCache: true, // Extension de gestion du stockage local
                crossOrigin: true
            }).addTo(map);

            // Vérification de la connexion
            majStatutReseau();
            window.addEventListener('online', majStatutReseau);
            window.addEventListener('offline', majStatutReseau);

            // Charger les gisements de France par défaut
            chargerGisements();
            
            // 3. Lancement du suivi GPS Matériel Haute Précision
            demarrerSuiviGPS();
        }

        function majStatutReseau() {
            const badge = document.getElementById('net-status');
            if (navigator.onLine) {
                badge.innerText = "En ligne";
                badge.className = "badge badge-online";
            } else {
                badge.innerText = "Hors-ligne (Mode Montagne)";
                badge.className = "badge";
            }
        }

        function demarrerSuiviGPS() {
            if (!navigator.geolocation) return;

            navigator.geolocation.watchPosition(function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                positionUtilisateur = [lat, lng];

                document.getElementById('gps-status').innerText = `Précision: ${position.coords.accuracy.toFixed(0)}m`;

                if (marqueurUtilisateur) {
                    marqueurUtilisateur.setLatLng(positionUtilisateur);
                } else {
                    marqueurUtilisateur = L.circleMarker(positionUtilisateur, { color: '#007bff', radius: 9, fillColor: '#fff', fillOpacity: 1 }).addTo(map);
                    map.setView(positionUtilisateur, 11);
                }

                // Calcul de proximité à 100km
                gisementsFrance.forEach(g => {
                    const dist = calculerDistance(lat, lng, g.lat, g.lng);
                    if (dist <= 100 && !g.notifie) {
                        envoyerNotificationNative(g.name, dist);
                        g.notifie = true;
                    }
                });

            }, function(error) {
                document.getElementById('gps-status').innerText = "Signal indisponible.";
            }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
        }

        function envoyerNotificationNative(nom, distance) {
            if (window.cordova && cordova.plugins && cordova.plugins.notification) {
                cordova.plugins.notification.local.schedule({
                    title: "💎 Gisement à proximité !",
                    text: `${nom} se situe à ${distance.toFixed(0)} km de votre itinéraire.`,
                    foreground: true
                });
            } else {
                alert(`💎 GISEMENT PROCHE 💎\n${nom} est à ${distance.toFixed(0)} km.`);
            }
        }

        function calculerDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2-lat1) * Math.PI / 180;
            const dLon = (lon2-lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function chargerGisements() {
            gisementsFrance.forEach(g => {
                L.marker([g.lat, g.lng]).addTo(map).bindPopup(`<b>${g.name}</b><br>Type: ${g.type}`);
            });
            mesTrouvailles.forEach(t => {
                L.marker([t.lat, t.lng], { icon: L.icon({ iconUrl: 'https://google.com' }) }).addTo(map).bindPopup(`<b>${t.name}</b>`);
            });
        }

        function marquerMaTrouvaille() {
            if (!positionUtilisateur) { alert("Attente du signal GPS satellite..."); return; }
            const nom = prompt("Quel type de gemme ou cristal avez-vous trouvé ici ?");
            if (nom) {
                const nouv = { name: "Ma trouvaille: " + nom, lat: positionUtilisateur[0], lng: positionUtilisateur[1] };
                mesTrouvailles.push(nouv);
                localStorage.setItem('mesTrouvailles', JSON.stringify(mesTrouvailles));
                L.marker([nouv.lat, nouv.lng]).addTo(map).bindPopup(`<b>${nouv.name}</b>`).openPopup();
            }
        }

        function telechargerZoneCarte() {
            alert("Préparation de la carte : Les images de la zone affichée à l'écran sont en cours de sauvegarde dans la mémoire de votre téléphone. Vous pourrez les consulter sans internet.");
            // Le plugin 'useCache' intercepte automatiquement les tuiles affichées pour les figer en local.
        }
    </script>
</body>
</html>
