<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gemmes Pro - Prospection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #1a1a2e;
            color: #e2e2e2;
        }
        h1 { color: #00f2fe; margin-bottom: 5px; text-transform: uppercase; font-size: 24px; }
        .subtitle { color: #4facfe; margin-top: 0; font-size: 14px; margin-bottom: 25px; }
        
        .radar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
            border: 4px solid #4facfe;
            border-radius: 50%;
            background: radial-gradient(circle, #162447 20%, #1a1a2e 80%);
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            overflow: hidden;
        }
        .radar-sweep {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(0,242,254,0.4) 0%, rgba(0,0,0,0) 50%);
            transform-origin: center;
            border-radius: 50%;
            animation: radar-beam 3s linear infinite;
        }
        @keyframes radar-beam {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .searching { background-color: #b83b5e; color: #fff; }
        .active { background-color: #00b16a; color: #fff; }

        /* Module de filtrage par rayon */
        .filter-box {
            background: #1f4068;
            margin: 10px auto;
            padding: 10px;
            max-width: 340px;
            border-radius: 8px;
            border: 1px solid #4facfe;
        }
        select {
            background: #162447;
            color: #00f2fe;
            border: 1px solid #4facfe;
            padding: 5px;
            border-radius: 4px;
            font-weight: bold;
        }

        .geo-box {
            background-color: #162447;
            border: 1px solid #4facfe;
            border-radius: 10px;
            padding: 12px;
            margin: 15px auto;
            max-width: 340px;
            text-align: left;
        }
        .geo-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .label { color: #84a9ac; }
        .value { color: #00f2fe; font-family: monospace; }

        .gisement-title {
            margin-top: 20px;
            text-align: left;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
            color: #4facfe;
            font-weight: bold;
        }
        .gisements-list {
            max-width: 340px;
            margin: 10px auto;
            padding: 0;
            list-style: none;
        }
        .gisement-item {
            background: #162447;
            border-left: 5px solid #00f2fe;
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 0 6px 6px 0;
            text-align: left;
        }
        .gisement-name { font-weight: bold; color: #fff; }
        .gisement-dist { float: right; color: #00f2fe; font-weight: bold; font-family: monospace; }
        .gisement-desc { font-size: 12px; color: #84a9ac; margin-top: 4px; }
    </style>
</head>
<body>

    <h1>Gemmes Pro</h1>
    <p class="subtitle">Analyseur de Données Terrains du Net</p>

    <div class="radar-container">
        <div class="radar-sweep"></div>
    </div>

    <div id="status" class="status-badge searching">Calibrage GPS...</div>

    <div class="filter-box">
        <label>Rayon de détection : </label>
        <select id="rayonSelect" onchange="relancerCalcul()">
            <option value="50">50 km</option>
            <option value="100" selected>100 km</option>
            <option value="500">500 km</option>
            <option value="9999">Tout afficher</option>
        </select>
    </div>

    <div class="geo-box">
        <div class="geo-line"><span class="label">Ma Position :</span><span id="coordsAffichage" class="value">--</span></div>
        <div class="geo-line"><span class="label">Précision :</span><span id="acc" class="value">--</span></div>
    </div>

    <div class="gisement-title">💎 Gisements Référencés Trouvés</div>
    <ul id="listeGisements" class="gisements-list">
        <li style="text-align: center; color: #84a9ac;">Calcul de proximité en cours...</li>
    </ul>

    <!-- IMPORTANT : Chargement de la base réseau locale puis de Cordova -->
    <script src="gisements.js"></script>
    <script src="cordova.js"></script>
    <script>
        let watchId = null;
        let maPositionActuelle = null;

        function updateStatus(text, statusClass) {
            const statusEl = document.getElementById('status');
            if (statusEl) {
                statusEl.textContent = text;
                statusEl.className = 'status-badge ' + statusClass;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.addEventListener('deviceready', () => {
                updateStatus('Modems GPS synchronisés', 'searching');
                startGeolocation();
            }, false);
        });

        function startGeolocation() {
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            watchId = navigator.geolocation.watchPosition(onSuccess, handleGeoError, {
                enableHighAccuracy: true, // Force l'usage des puces GPS matérielles
                maximumAge: 0,
                timeout: 10000
            });
        }

        function onSuccess(position) {
            updateStatus('GPS Actif', 'active');
            const myLat = position.coords.latitude;
            const myLng = position.coords.longitude;
            maPositionActuelle = { lat: myLat, lng: myLng };

            document.getElementById('coordsAffichage').textContent = myLat.toFixed(4) + " , " + myLng.toFixed(4);
            document.getElementById('acc').textContent = position.coords.accuracy.toFixed(1) + ' m';

            traiterGisements(myLat, myLng);
        }

        function calculerDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Rayon de la Terre en km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function traiterGisements(myLat, myLng) {
            const rayonMax = parseFloat(document.getElementById('rayonSelect').value);
            const conteneur = document.getElementById('listeGisements');
            conteneur.innerHTML = '';

            // Association des distances calculées
            let resultats = REPERTOIRE_GISEMENTS.map(g => {
                return { ...g, distance: calculerDistance(myLat, myLng, g.lat, g.lng) };
            });

            // Filtrage par distance et tri du plus proche au plus loin
            let filtres = resultats.filter(g => g.distance <= rayonMax);
            filtres.sort((a, b) => a.distance - b.distance);

            if (filtres.length === 0) {
                conteneur.innerHTML = `<li style='text-align:center;color:#b83b5e;padding:10px;'>Aucun gisement répertorié dans un rayon de ${rayonMax} km.</li>`;
                return;
            }

            filtres.forEach(g => {
                const li = document.createElement('li');
                li.className = 'gisement-item';
                let affichageDist = g.distance.toFixed(1) + " km";
                
                li.innerHTML = `
                    <span class="gisement-dist">${affichageDist}</span>
                    <div class="gisement-name">${g.nom}</div>
                    <div class="gisement-desc">${g.details}</div>
                `;
                conteneur.appendChild(li);
            });
        }

        function relancerCalcul() {
            if (maPositionActuelle) {
                traiterGisements(maPositionActuelle.lat, maPositionActuelle.lng);
            }
        }

        function handleGeoError(error) {
            updateStatus('Signal satellite perdu', 'searching');
        }
    </script>
</body>
</html>
