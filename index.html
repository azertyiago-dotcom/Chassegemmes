<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: gap:">
<title>Gemmes Pro - Radar</title>
<link rel="stylesheet" href="leaflet.css" />
<script src="leaflet.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;background:#1a1a2e;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#e2e2e2;overflow:hidden}
#main-container{display:flex;flex-direction:column;height:100%}
#map{height:55vh;width:100%;background:#0f172a;position:relative}
.panel-bas{height:45vh;background:#162447;border-top:3px solid #4facfe;box-sizing:border-box;padding:10px 15px;display:flex;flex-direction:column;overflow:hidden}
.header-panel{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
h1{color:#00f2fe;margin:0;text-transform:uppercase;font-size:16px}
.status-badge{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:bold;text-transform:uppercase}
.searching{background:#b83b5e;color:#fff}
.active{background:#00b16a;color:#fff}
.network{background:#e0a100;color:#fff}
.geo-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px;background:#1f4068;padding:6px;border-radius:4px;margin-bottom:8px}
.geo-item{font-family:monospace;color:#00f2fe}
.geo-item span:first-child{color:#84a9ac;font-family:sans-serif}
.filtre{background:#111b30;color:#e2e2e2;border:1px solid #4facfe;border-radius:4px;font-size:12px;padding:2px 4px}
#overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:2000;align-items:center;justify-content:center}
#overlay.ouvert{display:flex}
.modal{background:#162447;border:1px solid #4facfe;border-radius:8px;padding:14px;width:86%;max-width:360px;font-size:13px;box-sizing:border-box}
.modal input,.modal select,.modal textarea{width:100%;box-sizing:border-box;margin-top:6px;background:#111b30;color:#fff;border:1px solid #4facfe;border-radius:4px;padding:7px;font-size:14px;font-family:inherit}
.modal textarea{height:70px}
.modal .btns{display:flex;gap:8px;margin-top:10px}
.modal button{flex:1;padding:9px;border:0;border-radius:4px;font-size:14px;font-weight:bold;background:#4facfe;color:#0f172a}
.modal button.sec{background:#1f4068;color:#e2e2e2}
.gisement-title{color:#4facfe;font-size:13px;font-weight:bold;text-transform:uppercase;margin-bottom:5px}
.gisements-list{flex:1;margin:0;padding:0;list-style:none;overflow-y:auto}
.gisement-item{background:#111b30;border-left:4px solid #b83b5e;margin-bottom:5px;padding:8px 10px;border-radius:0 4px 4px 0;font-size:13px}
.gisement-name{font-weight:bold;color:#fff}
.gisement-dist{float:right;color:#00f2fe;font-weight:bold;font-family:monospace}
.gisement-desc{font-size:11px;color:#84a9ac;margin-top:2px}
</style>
</head>
<body>
<div id="main-container">
  <div id="map"></div>
  <div class="panel-bas">
    <div class="header-panel">
      <h1>Gemmes Pro Radar</h1>
      <div id="status" class="status-badge searching">Initialisation...</div>
    </div>
    <div class="geo-grid">
      <div class="geo-item"><span>Pos: </span><span id="coordsAffichage">Recherche...</span></div>
      <div class="geo-item" style="text-align:right"><span>Précision: </span><span id="acc">--</span></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
      <div class="gisement-title" style="margin:0">📌 Gisements :</div>
      <select id="filtreType" class="filtre" onchange="changerFiltre(this.value)">
        <option value="tous">Tous</option>
        <option value="gemme">💎 Gemmes</option>
        <option value="metal">🪙 Métaux</option>
        <option value="mineral">🪨 Minéraux</option>
        <option value="fossile">🦴 Fossiles</option>
      </select>
    </div>
    <ul id="listeGisements" class="gisements-list">
      <li style="text-align:center;color:#84a9ac;padding-top:10px;font-size:12px">En attente de position...</li>
    </ul>
  </div>
</div>

<div id="overlay"><div class="modal" id="modal"></div></div>

<script src="gisements.js"></script>
<script src="cordova.js"></script>
<script>
let map = null, userMarker = null, carteEnCours = false;
let cercles = [], marqueursGis = [], derniereListe = [];
let filtreType = 'tous', derniereLat = null, derniereLng = null;
const TYPES = {
  gemme:   { label: 'Gemme',   color: '#a855f7' },
  metal:   { label: 'Métal',   color: '#f59e0b' },
  fossile: { label: 'Fossile', color: '#22c55e' },
  mineral: { label: 'Minéral', color: '#b83b5e' }
};
function typeGis(g) { return TYPES[g.type] ? g.type : 'mineral'; }

// ---------- Points personnels (sauvegarde locale sur le téléphone) ----------
const CLE_PERSO = 'gemmespro_perso';
let positionActuelle = null;
function esc(t) {
  return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function lirePerso() {
  try { return JSON.parse(localStorage.getItem(CLE_PERSO) || '[]'); } catch (e) { return []; }
}
function ecrirePerso(arr) {
  try { localStorage.setItem(CLE_PERSO, JSON.stringify(arr)); return true; } catch (e) { return false; }
}
if (typeof REPERTOIRE_GISEMENTS !== 'undefined') {
  lirePerso().forEach(p => REPERTOIRE_GISEMENTS.push(p));
}
let systemeDemarre = false, watchReseau = null, watchGPS = null;
let dernierGPS = 0, positionRecue = false;

function updateStatus(text, cls) {
  const el = document.getElementById('status');
  if (el) { el.textContent = text; el.className = 'status-badge ' + cls; }
}

function demarrerApplication() {
  if (systemeDemarre) return;
  systemeDemarre = true;
  lancerSuiviGPS();
}

// Deux suivis en parallèle : réseau/Wi-Fi (rapide) + GPS (précis)
function lancerSuiviGPS() {
  if (!navigator.geolocation) { updateStatus('GPS indisponible', 'searching'); return; }
  updateStatus('Recherche position...', 'searching');

  watchReseau = navigator.geolocation.watchPosition(
    p => onPosition(p, 'reseau'), onLocationError,
    { enableHighAccuracy: false, maximumAge: 30000, timeout: 20000 });

  watchGPS = navigator.geolocation.watchPosition(
    p => onPosition(p, 'gps'), onLocationError,
    { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}

document.addEventListener('deviceready', demarrerApplication, false);
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => { if (!systemeDemarre) demarrerApplication(); }, 1500);
});

function calculerDistance(lat1, lon1, lat2, lon2) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function onPosition(position, source) {
  const now = Date.now();
  if (source === 'gps') dernierGPS = now;
  else if (now - dernierGPS < 20000) return; // un fix GPS récent prime sur le réseau

  positionRecue = true;
  if (source === 'gps') updateStatus('GPS précis', 'active');
  else updateStatus('Position réseau', 'network');

  const lat = position.coords.latitude;
  const lng = position.coords.longitude;
  const acc = position.coords.accuracy;
  if (lat == null || lng == null) return;
  positionActuelle = { lat: lat, lng: lng, acc: acc || 0, source: source };

  document.getElementById('coordsAffichage').textContent = lat.toFixed(4) + ' , ' + lng.toFixed(4);
  document.getElementById('acc').textContent = (acc != null ? acc.toFixed(0) : '--') + ' m';

  if (!map) initCarte(lat, lng); else majCarte(lat, lng);
  genererAffichageGisements(lat, lng);
}

function initCarte(lat, lng) {
  if (carteEnCours || typeof L === 'undefined') return;
  carteEnCours = true;
  setTimeout(() => {
    try {
      map = L.map('map', { zoomControl: true, attributionControl: false }).setView([lat, lng], 11);
      [2000, 5000, 10000].forEach(r => {
        cercles.push(L.circle([lat, lng], { radius: r, color: '#4facfe', weight: 1, fill: false, dashArray: '5, 5' }).addTo(map));
      });
      userMarker = L.circleMarker([lat, lng], {
        radius: 9, color: '#fff', weight: 2, fillColor: '#00f2fe', fillOpacity: 1
      }).addTo(map).bindPopup('Vous êtes ici');

      if (typeof REPERTOIRE_GISEMENTS !== 'undefined') {
        REPERTOIRE_GISEMENTS.forEach(g => marqueursGis.push(creerMarqueur(g)));
      }
      // Fond de carte (uniquement si réseau ; sinon le fond bleu nuit reste)
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, opacity: 0.55 }).addTo(map);
      ajouterBoutons();
      map.invalidateSize();
      cadrerProches(3);
    } catch (e) {
      console.log('Erreur carte : ' + e.message);
      carteEnCours = false;
    }
  }, 100);
}

function majCarte(lat, lng) {
  if (userMarker) userMarker.setLatLng([lat, lng]);
  cercles.forEach(c => c.setLatLng([lat, lng]));
}

function creerMarqueur(g) {
  const t = TYPES[typeGis(g)];
  let html = '<b>' + (g.perso ? '★ ' : '') + esc(g.nom) + '</b> (' + t.label + ')<br>' + esc(g.details);
  if (g.perso) {
    html += '<br><small>' + esc(g.date) + ' · ±' + g.acc + ' m</small><br>' +
            '<button onclick="supprimerPerso(' + g.id + ')">🗑 Supprimer</button>';
  }
  const m = L.circleMarker([g.lat, g.lng], {
    radius: g.perso ? 9 : 7, color: g.perso ? '#00f2fe' : '#fff', weight: g.perso ? 3 : 1,
    fillColor: t.color, fillOpacity: 0.9
  }).addTo(map).bindPopup(html);
  if (filtreType !== 'tous' && typeGis(g) !== filtreType) map.removeLayer(m);
  return m;
}

function ouvrirModal(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('overlay').className = 'ouvert';
}
function fermerModal() { document.getElementById('overlay').className = ''; }

function ouvrirFormulaire() {
  const p = positionActuelle;
  if (!p) { alert('Position non disponible : attendez le signal.'); return; }
  const opts = Object.keys(TYPES).map(k => '<option value="' + k + '">' + TYPES[k].label + '</option>').join('');
  ouvrirModal(
    '<b style="color:#00f2fe">➕ Marquer ce point</b>' +
    '<div style="margin:6px 0;font-family:monospace;color:#00f2fe">' + p.lat.toFixed(5) + ' , ' + p.lng.toFixed(5) +
    ' (±' + Math.round(p.acc) + ' m)</div>' +
    (p.acc > 50 ? '<div style="color:#f59e0b">⚠ Précision faible (' + (p.source === 'gps' ? 'GPS' : 'réseau') +
      '). Attendez le GPS pour un point plus exact.</div>' : '') +
    '<input id="pNom" placeholder="Minéral / nom du lieu" />' +
    '<select id="pType">' + opts + '</select>' +
    '<textarea id="pNotes" placeholder="Notes (couleur, taille, accès...)"></textarea>' +
    '<div class="btns"><button class="sec" onclick="fermerModal()">Annuler</button>' +
    '<button onclick="enregistrerPoint()">Enregistrer</button></div>');
}

function enregistrerPoint() {
  const p = positionActuelle;
  if (!p) return;
  const g = {
    id: Date.now(), perso: true,
    nom: document.getElementById('pNom').value.trim() || 'Point sans nom',
    type: document.getElementById('pType').value,
    details: document.getElementById('pNotes').value.trim(),
    lat: +p.lat.toFixed(6), lng: +p.lng.toFixed(6),
    date: new Date().toLocaleDateString('fr-FR'), acc: Math.round(p.acc)
  };
  const arr = lirePerso(); arr.push(g);
  if (!ecrirePerso(arr)) alert('Sauvegarde impossible sur ce téléphone.');
  REPERTOIRE_GISEMENTS.push(g);
  if (map && marqueursGis.length === REPERTOIRE_GISEMENTS.length - 1) marqueursGis.push(creerMarqueur(g));
  genererAffichageGisements(derniereLat !== null ? derniereLat : p.lat, derniereLng !== null ? derniereLng : p.lng);
  fermerModal();
}

function supprimerPerso(id) {
  if (!confirm('Supprimer ce point ?')) return;
  ecrirePerso(lirePerso().filter(x => x.id !== id));
  const idx = REPERTOIRE_GISEMENTS.findIndex(x => x.id === id);
  if (idx >= 0) {
    REPERTOIRE_GISEMENTS.splice(idx, 1);
    if (marqueursGis[idx]) { if (map) map.removeLayer(marqueursGis[idx]); marqueursGis.splice(idx, 1); }
  }
  if (map) map.closePopup();
  if (derniereLat !== null) genererAffichageGisements(derniereLat, derniereLng);
}

function ouvrirExport() {
  const arr = lirePerso();
  if (!arr.length) { alert('Aucun point personnel enregistré.'); return; }
  const txt = '// À coller dans gisements.js, avant la ligne finale "];"\n' +
    arr.map(x => '    ' + JSON.stringify({ nom: x.nom, lat: x.lat, lng: x.lng, type: x.type,
      details: (x.details ? x.details + ' ' : '') + '(point terrain ' + x.date + ', ±' + x.acc + ' m)' }) + ',').join('\n');
  ouvrirModal('<b style="color:#00f2fe">📤 Mes points (' + arr.length + ')</b>' +
    '<textarea id="pExport" style="height:150px;font-size:11px;font-family:monospace" readonly>' + esc(txt) + '</textarea>' +
    '<div class="btns"><button class="sec" onclick="fermerModal()">Fermer</button>' +
    '<button onclick="copierExport()">Copier</button></div>');
}
function copierExport() {
  const t = document.getElementById('pExport');
  t.select();
  try { document.execCommand('copy'); alert('Copié.'); } catch (e) { alert('Sélectionnez et copiez le texte manuellement.'); }
}

function changerFiltre(v) {
  filtreType = v;
  if (map) marqueursGis.forEach((m, i) => {
    const visible = v === 'tous' || typeGis(REPERTOIRE_GISEMENTS[i]) === v;
    if (visible) map.addLayer(m); else map.removeLayer(m);
  });
  if (derniereLat !== null) genererAffichageGisements(derniereLat, derniereLng);
  cadrerProches(3);
}

function cadrerProches(n) {
  if (!map || !userMarker || !derniereListe.length) return;
  const pts = [userMarker.getLatLng()].concat(
    derniereListe.slice(0, n).map(x => L.latLng(x.g.lat, x.g.lng)));
  map.fitBounds(L.latLngBounds(pts), { padding: [30, 30], maxZoom: 13 });
}

function cadrerTous() {
  if (!map || !userMarker || typeof REPERTOIRE_GISEMENTS === 'undefined') return;
  const pts = [userMarker.getLatLng()].concat(
    REPERTOIRE_GISEMENTS.filter(g => filtreType === 'tous' || typeGis(g) === filtreType).map(g => L.latLng(g.lat, g.lng)));
  map.fitBounds(L.latLngBounds(pts), { padding: [30, 30] });
}

function allerA(i) {
  if (!map || !marqueursGis[i]) return;
  map.setView(marqueursGis[i].getLatLng(), 12);
  marqueursGis[i].openPopup();
}

function ajouterBoutons() {
  const Ctl = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      const d = L.DomUtil.create('div');
      d.style.cssText = 'display:flex;flex-direction:column;gap:4px';
      [['📍', function () { if (userMarker) map.setView(userMarker.getLatLng(), 13); }],
       ['🎯', function () { cadrerProches(3); }],
       ['🌍', cadrerTous],
       ['➕', ouvrirFormulaire],
       ['📤', ouvrirExport]].forEach(function (b) {
        const a = L.DomUtil.create('a', '', d);
        a.innerHTML = b[0]; a.href = '#';
        a.style.cssText = 'background:#fff;width:34px;height:34px;line-height:34px;text-align:center;font-size:18px;border-radius:4px;text-decoration:none';
        L.DomEvent.on(a, 'click', function (e) { L.DomEvent.preventDefault(e); b[1](); });
      });
      L.DomEvent.disableClickPropagation(d);
      return d;
    }
  });
  map.addControl(new Ctl());
}

function genererAffichageGisements(lat, lng) {
  derniereLat = lat; derniereLng = lng;
  const ul = document.getElementById('listeGisements');
  if (!ul || typeof REPERTOIRE_GISEMENTS === 'undefined') return;
  const liste = REPERTOIRE_GISEMENTS
    .map((g, i) => ({ g: g, i: i, d: calculerDistance(lat, lng, g.lat, g.lng) }))
    .filter(x => filtreType === 'tous' || typeGis(x.g) === filtreType)
    .sort((a, b) => a.d - b.d);
  derniereListe = liste;
  ul.innerHTML = liste.map(x =>
    '<li class="gisement-item" style="border-left-color:' + TYPES[typeGis(x.g)].color + '" onclick="allerA(' + x.i + ')">' +
    '<span class="gisement-name">' + (x.g.perso ? '★ ' : '') + esc(x.g.nom) + '</span>' +
    '<span class="gisement-dist">' + x.d.toFixed(1) + ' km</span>' +
    '<div class="gisement-desc">' + TYPES[typeGis(x.g)].label + ' · ' + esc(x.g.details) + '</div></li>').join('');
}

function onLocationError(err) {
  if (positionRecue) return; // une position valide existe déjà, on ignore
  const msgs = { 1: 'Permission refusée', 2: 'Position indisponible', 3: 'Délai dépassé' };
  updateStatus(msgs[err.code] || 'Erreur GPS', 'searching');
  console.log('Geoloc erreur ' + err.code + ' : ' + err.message);
}
</script>
</body>
</html>
