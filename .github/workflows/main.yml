name: Generation APK Gratuite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Configuration de l'environnement Java (Hybride)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: |
          17
          11
        # On installe les deux versions : Java 17 sera la version par défaut au début

    - name: Installation automatique de Gradle 7.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.6'

    - name: Installation des Android Build Tools 33.0.2 manquants
      run: |
        # Cette commande s'exécute avec Java 17 par défaut, donc SdkManager ne plantera plus !
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2"

    - name: Configuration de NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Installation globale de Cordova
      run: npm install -g cordova

    - name: Création du projet natif Android
      run: |
        cordova create appli_native com.chasseurdegemmes.pro "GemmesPro"
        cp config.xml appli_native/config.xml
        cp index.html appli_native/www/index.html
        cd appli_native
        cordova platform add android@12.0.0
        cordova plugin add cordova-plugin-background-mode-fixed
        
    - name: Compilation de l'APK Final
      run: |
        cd appli_native
        # Juste avant de compiler, on force Cordova à utiliser Java 11 pour rester compatible avec Android 12 et Gradle 7.6
        export JAVA_HOME=$JAVA_HOME_11_X64
        CORDOVA_ANDROID_GRADLE_VERSION="7.6" cordova build android --debug
        
    - name: Livraison du fichier APK
      uses: actions/upload-artifact@v4
      with:
        name: Application-Gemmes-Moutagne
        path: appli_native/platforms/android/app/build/outputs/apk/debug/app-debug.apk
