name: Generation APK Gratuite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Configuration de l'environnement Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11' # Parfaitement compatible avec Gradle 7.6

    - name: Configuration de NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Installation manuelle de Gradle 7.6
      run: |
        # 1. On supprime la version globale de Gradle 9 qui fait planter le build
        sudo rm -rf /usr/share/gradle*
        sudo rm -rf /usr/bin/gradle
        
        # 2. On télécharge proprement la version officielle de Gradle 7.6
        wget -q https://gradle.org
        sudo unzip -q gradle-7.6-bin.zip -d /usr/share
        
        # 3. On crée le lien système pour que Cordova le trouve instantanément dans le PATH
        sudo ln -s /usr/share/gradle-7.6/bin/gradle /usr/bin/gradle

    - name: Installation globale de Cordova
      run: npm install -g cordova

    - name: Création du projet natif Android
      run: |
        cordova create appli_native com.chasseurdegemmes.pro "GemmesPro"
        cp config.xml appli_native/config.xml
        cp index.html appli_native/www/index.html
        cd appli_native
        cordova platform add android@12.0.0
        cordova plugin add cordova-plugin-background-mode-fixed
        
    - name: Compilation de l'APK Final
      run: |
        cd appli_native
        cordova build android --debug
        
    - name: Livraison du fichier APK
      uses: actions/upload-artifact@v4
      with:
        name: Application-Gemmes-Moutagne
        path: appli_native/platforms/android/app/build/outputs/apk/debug/app-debug.apk
