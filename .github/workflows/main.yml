name: Generation APK Gratuite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Configuration de l'environnement Java (Stable pour Gradle 7.6)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Installation automatique de Gradle 7.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.6'

    - name: Installation des Android Build Tools 33.0.2
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2"

    - name: Configuration de NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Installation globale de Cordova
      run: npm install -g cordova

    - name: Structure des dossiers et création du projet natif Android
      run: |
        # Crée un dossier www temporaire si index.html est à la racine de votre dépôt Git
        if [ ! -d "www" ]; then
          mkdir www
          cp index.html www/ 2>/dev/null || true
        fi
        
        # Création de l'espace Cordova
        cordova create appli_native com.chasseurdegemmes.pro "GemmesPro"
        cp config.xml appli_native/config.xml
        cp -r www/* appli_native/www/
        
        cd appli_native
        cordova platform add android@12.0.0

    - name: Installation du plugin Cordova Géolocalisation Officiel
      run: |
        cd appli_native
        # Le plugin officiel suffit amplement et gère ses propres permissions sans planter le build
        cordova plugin add cordova-plugin-geolocation@^5.0.0

    - name: Compilation de l'APK Final
      run: |
        cd appli_native
        cordova build android --debug

    - name: Livraison du fichier APK
      uses: actions/upload-artifact@v4
      with:
        name: Application-Gemmes-Montagne
        path: appli_native/platforms/android/app/build/outputs/apk/debug/app-debug.apk
