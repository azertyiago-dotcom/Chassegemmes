name: Generation APK Gratuite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Configuration de l'environnement Java (Outils Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Installation automatique de Gradle 7.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.6'

    - name: Installation des Android Build Tools 33.0.2
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2"

    - name: Configuration de NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Installation globale de Cordova
      run: npm install -g cordova

    - name: Structure des dossiers et création du projet natif Android
      run: |
        # Nettoyage préventif
        rm -rf appli_native
        
        # 1. Création de l'architecture officielle Cordova
        cordova create appli_native com.chasseurdegemmes.pro "GemmesPro"
        
        # 2. Copie du fichier de configuration global
        cp config.xml appli_native/config.xml
        
        # 3. Sécurité : Nettoyage du dossier www généré par défaut pour éviter les conflits
        rm -f appli_native/www/index.html
        rm -rf appli_native/www/js
        rm -rf appli_native/www/css
        rm -rf appli_native/www/img
        
        # 4. Injection intelligente de VOS fichiers (gère si vous êtes à la racine ou dans un dossier www)
        if [ -d "www" ]; then
          cp -r www/* appli_native/www/
        else
          cp index.html appli_native/www/
          # Copie aussi vos dossiers css/js/img s'ils existent à la racine de votre Git
          cp -r css appli_native/www/ 2>/dev/null || true
          cp -r js appli_native/www/ 2>/dev/null || true
          cp -r img appli_native/www/ 2>/dev/null || true
        fi
        
        # Vérification visuelle dans les logs que index.html est au bon endroit
        echo "=== CONTENU DU DOSSIER WWW DE CORDOVA ==="
        ls -la appli_native/www/
        
        cd appli_native
        cordova platform add android@12.0.0 --verbose

    - name: Installation du plugin Cordova Géolocalisation Officiel
      run: |
        cd appli_native
        cordova plugin add cordova-plugin-geolocation@^5.0.0 --verbose

    - name: Compilation de l'APK Final
      run: |
        cd appli_native
        cordova build android --debug --verbose

    - name: Extraction de l'APK vers la racine
      run: |
        mkdir -p output_apk
        find . -name "*.apk" -exec cp {} output_apk/ \;
        echo "Contenu du dossier de sortie :"
        ls -la output_apk/

    - name: Livraison du fichier APK
      uses: actions/upload-artifact@v4
      with:
        name: Application-Gemmes-Montagne
        path: output_apk/*.apk
        if-no-files-found: error
