name: Generation APK Gratuite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Configuration de l'environnement Java (Outils Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Installation automatique de Gradle 7.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.6'

    - name: Installation des Android Build Tools et SDK 33
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2" "platforms;android-33"

    - name: Configuration de NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Installation globale de Cordova
      run: npm install -g cordova

    - name: Structure des dossiers et création du projet natif Android
      run: |
        # Nettoyage préventif des builds précédents
        rm -rf appli_native
        
        # 1. Création de l'architecture officielle Cordova avec le bon Package ID
        cordova create appli_native com.gemmespro.app "GemmesPro"
        
        # 2. Copie du fichier de configuration global validé
        cp config.xml appli_native/config.xml
        
        # 3. Sécurité : Nettoyage du dossier www généré par défaut pour éviter les conflits
        rm -f appli_native/www/index.html
        rm -rf appli_native/www/js
        rm -rf appli_native/www/css
        rm -rf appli_native/www/img
        
        # 4. Injection intelligente et sécurisée de VOS fichiers de prospection
        if [ -d "www" ]; then
          cp -r www/* appli_native/www/
        else
          cp index.html appli_native/www/
          cp gisements.js appli_native/www/
          cp -r css appli_native/www/ 2>/dev/null || true
          cp -r js appli_native/www/ 2>/dev/null || true
          cp -r img appli_native/www/ 2>/dev/null || true
        fi
        
        # Vérification dans les logs que index.html et gisements.js sont présents au bon endroit
        echo "=== VÉRIFICATION DU DOSSIER WWW AVANT COMPILATION ==="
        ls -la appli_native/www/
        
        cd appli_native
        cordova platform add android@12.0.0 --verbose

    - name: Installation du plugin Cordova Géolocalisation Officiel
      run: |
        cd appli_native
        cordova plugin add cordova-plugin-geolocation@^5.0.0 --save --verbose

    - name: Compilation de l'APK Final
      run: |
        cd appli_native
        cordova build android --debug --verbose

    - name: Extraction de l'APK vers la racine
      run: |
        mkdir -p output_apk
        find appli_native/platforms/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/ \;
        echo "=== CONTENU DU DOSSIER DE SORTIE ==="
        ls -la output_apk/

    - name: Livraison du fichier APK
      uses: actions/upload-artifact@v4
      with:
        name: Application-Gemmes-Montagne
        path: output_apk/*.apk
        if-no-files-found: error
