name: Generation APK Gratuite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Configuration de l'environnement Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Installation automatique de Gradle 7.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.6'

    - name: Installation des Android Build Tools et SDK 33
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        export PATH=$JAVA_HOME/bin:$PATH
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2" "platforms;android-33"

    - name: Configuration de NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Installation de Cordova
      run: npm install -g cordova@12

    - name: Téléchargement des fichiers Leaflet locaux
      run: |
        curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js -o leaflet.js
        curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css -o leaflet.css
        echo "=== Vérification Leaflet ==="
        ls -la leaflet.js leaflet.css
        head -c 120 leaflet.js; echo
        test $(stat -c%s leaflet.js) -gt 100000 || { echo "ERREUR : leaflet.js invalide"; exit 1; }

    - name: Création du projet Cordova et injection des fichiers
      run: |
        rm -rf appli_native
        cordova create appli_native com.gemmespro.app "GemmesPro"
        cp config.xml appli_native/config.xml

        rm -f appli_native/www/index.html
        rm -rf appli_native/www/js appli_native/www/css appli_native/www/img

        if [ -d "www" ]; then
          echo ">>> Source utilisée : dossier www/"
          cp -r www/* appli_native/www/
        else
          echo ">>> Source utilisée : fichiers à la racine"
          cp index.html appli_native/www/
          cp gisements.js appli_native/www/
          cp -r css appli_native/www/ 2>/dev/null || true
          cp -r js appli_native/www/ 2>/dev/null || true
          cp -r img appli_native/www/ 2>/dev/null || true
        fi
        cp leaflet.js appli_native/www/
        cp leaflet.css appli_native/www/

        echo "=== CONTENU DE WWW ==="
        ls -la appli_native/www/

        cd appli_native
        cordova platform add android@12.0.0 --verbose

    - name: Installation du plugin de géolocalisation
      run: |
        cd appli_native
        cordova plugin add "cordova-plugin-geolocation@^5.0.0" --save --verbose

    - name: Compilation de l'APK debug
      run: |
        cd appli_native
        cordova build android --debug --verbose

    - name: Extraction de l'APK
      run: |
        mkdir -p output_apk
        find appli_native/platforms/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/ \;
        ls -la output_apk/

    - name: Livraison de l'APK
      uses: actions/upload-artifact@v4
      with:
        name: Application-Gemmes-Montagne
        path: output_apk/*.apk
        if-no-files-found: error
