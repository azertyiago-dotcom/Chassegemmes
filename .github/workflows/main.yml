name: Generation APK Gratuite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Configuration de l'environnement Java (Outils Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Installation automatique de Gradle 7.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.6'

    - name: Installation des Android Build Tools 33.0.2
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2"

    - name: Configuration de NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Installation globale de Cordova
      run: npm install -g cordova

    - name: Structure des dossiers et création du projet natif Android
      run: |
        # Création propre du dossier www si absent
        if [ ! -d "www" ]; then
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          fi
        fi
        
        # Nettoyage préventif d'un ancien dossier
        rm -rf appli_native
        
        # Création et bascule forcée dans le dossier Cordova
        cordova create appli_native com.chasseurdegemmes.pro "GemmesPro"
        cp config.xml appli_native/config.xml
        cp -r www/* appli_native/www/
        
        cd appli_native
        # On force l'ajout et on vérifie qu'il se crée bien
        cordova platform add android@12.0.0 --verbose

    - name: Installation du plugin Cordova Géolocalisation Officiel
      run: |
        cd appli_native
        cordova plugin add cordova-plugin-geolocation@^5.0.0 --verbose

    - name: Compilation de l'APK Final
      run: |
        cd appli_native
        cordova build android --debug --verbose

    - name: Extraction de l'APK vers la racine
      run: |
        mkdir -p output_apk
        # Recherche large à partir de la racine pour ne rien rater
        find . -name "*.apk" -exec cp {} output_apk/ \;
        echo "Contenu du dossier de sortie :"
        ls -la output_apk/

    - name: Livraison du fichier APK
      uses: actions/upload-artifact@v4
      with:
        name: Application-Gemmes-Montagne
        path: output_apk/*.apk
        if-no-files-found: error
